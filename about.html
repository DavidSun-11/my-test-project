<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>关于我</title>

    <style>
        body{
            background: #020b1f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .card{
            width: 600px;
            margin: auto;
            background: rgba(255,255,255,0.08);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        a{
            color: cyan;
            text-decoration: none;
        }
        .game-card {
    display: flex;
    gap: 20px;
    align-items: center;
}

.game-card img {
    width: 180px;
    height: 110px;
    object-fit: cover;
    border-radius: 15px;
}

.game-button {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: cyan;
    color: #00111f;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}
    </style>
</head>

<body>

  <div class="card">
    <h2>我的游戏展示</h2>

    <div class="game-card">
        <img src="wutheringwaves.jpg" alt="王者">
        <div>
            <h3>永劫无间</h3>
            <p>龙骧双刀，天下无双。</p>
            <a href="wutheringwaves.html" class="game-button">进入展示页</a>
        </div>
    </div>
</div>

</body>
</html>
