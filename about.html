<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>关于我</title>
    <link rel="stylesheet" href="live2d/live2d-widget.css">
    <link rel="stylesheet" href="assets/music-player.css">

    <style>
        body{
            background: #020b1f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .card{
            width: 600px;
            margin: auto;
            background: rgba(255,255,255,0.08);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        a{
            color: cyan;
            text-decoration: none;
        }
        .game-card {
    display: flex;
    gap: 20px;
    align-items: center;
}

.game-card img {
    width: 180px;
    height: 110px;
    object-fit: cover;
    border-radius: 15px;
}

.game-button {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: cyan;
    color: #00111f;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}
    </style>
</head>

<body>

  <div class="card">
    <h2>我的游戏展示</h2>

    <div class="game-card">
        <img src="wutheringwaves.jpg" alt="王者">
        <div>
            <h3>永劫无间</h3>
            <p>龙骧双刀，天下无双。</p>
            <a href="wutheringwaves.html" class="game-button">进入展示页</a>
        </div>
    </div>
</div>

<!-- 网易云音乐外链播放器：醉赤壁，歌曲 ID 108478；如版权限制无法播放，只替换 src 里的 id 即可。 -->
<div class="netease-player" aria-label="网易云音乐播放器：醉赤壁">
    <iframe title="网易云音乐播放器：醉赤壁" src="https://music.163.com/outchain/player?type=2&id=108478&auto=0&height=66" width="330" height="86" allow="autoplay"></iframe>
</div>

<!-- Live2D 看板娘：左下角固定悬浮，不影响关于页卡片布局。 -->
<div class="live2d-widget" id="live2d-widget" aria-label="Live2D 看板娘">
    <div class="live2d-message">Live2D 加载中...</div>
</div>
<script>
    window.Live2DWidgetConfig = {
        modelPath: "https://cdn.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json",
        dockedPosition: "left"
    };
</script>
<script src="live2d/live2d-widget.js?v=20260527-3"></script>
</body>
</html>
