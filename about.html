<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260608-1"></script>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260609-3">

    <style>
        body{
            background: #020b1f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
            overflow-x: hidden;
        }

        .card{
            width: 600px;
            margin: auto;
            background: rgba(255,255,255,0.08);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        a{
            color: cyan;
            text-decoration: none;
        }
        .game-card {
    display: flex;
    gap: 20px;
    align-items: center;
}

.game-card img {
    width: 180px;
    height: 110px;
    object-fit: cover;
    border-radius: 15px;
}

.game-button {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: cyan;
    color: #00111f;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 768px) {
    body {
        padding: 72px 14px 110px;
    }

    .card {
        width: min(100%, 560px);
        padding: 22px;
        box-sizing: border-box;
        backdrop-filter: blur(6px);
    }

    .game-card {
        flex-direction: column;
        text-align: center;
    }

    .game-card img {
        width: 100%;
        max-width: 260px;
        height: auto;
    }

    .game-button {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
}
    </style>
</head>

<body>

  <div class="card">
    <h2>我的游戏展示</h2>

    <div class="game-card">
        <img src="wutheringwaves.jpg" alt="王者">
        <div>
            <h3>永劫无间</h3>
            <p>龙骧双刀，天下无双。</p>
            <a href="wutheringwaves.html" class="game-button">进入展示页</a>
        </div>
    </div>
</div>

<script>
    window.Live2DWidgetConfig = {
        modelName: "ganyu",
        modelPath: "live2d/models/ganyu/Ganyu1024.model3.json",
        dockedPosition: "left",
        scale: 0.216,
        stageStyle: {
            width: 336,
            height: 456
        },
        mobileScale: 0.075,
        mobileStageStyle: {
            width: 240,
            height: 400
        }
    };
    if (window.JunxuePerformanceMode && typeof window.JunxuePerformanceMode.applyLive2DConfig === "function") {
        window.JunxuePerformanceMode.applyLive2DConfig(window.Live2DWidgetConfig);
    }
</script>
<script src="assets/live2d-loader.js?v=20260609-3" data-live2d-autoload="manual"></script>
</body>
</html>
