<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>认识君雪</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            font-family: Arial, sans-serif;
            color: #f7fbff;
            text-align: center;
            background:
                radial-gradient(circle at 24% 20%, rgba(108, 229, 255, 0.18), transparent 34%),
                radial-gradient(circle at 78% 72%, rgba(159, 132, 255, 0.13), transparent 36%),
                linear-gradient(145deg, #01040b 0%, #04111f 48%, #071b31 100%);
            overflow-x: hidden;
        }

        .about-placeholder {
            width: min(560px, 100%);
            padding: 30px 24px;
            border: 1px solid rgba(108, 229, 255, 0.38);
            border-radius: 22px;
            background:
                radial-gradient(circle at 18% 0%, rgba(108, 229, 255, 0.12), transparent 38%),
                rgba(5, 18, 36, 0.82);
            box-shadow:
                0 0 24px rgba(0, 190, 255, 0.16),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        h1 {
            margin: 0 0 12px;
            color: #eafcff;
            font-size: clamp(26px, 7vw, 36px);
            line-height: 1.3;
            text-shadow: 0 0 16px rgba(108, 229, 255, 0.34);
        }

        p {
            margin: 0 0 22px;
            color: rgba(234, 252, 255, 0.78);
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border: 1px solid rgba(108, 229, 255, 0.46);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(73, 214, 255, 0.24), rgba(255, 255, 255, 0.1));
            color: #f7fbff;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 14px rgba(0, 190, 255, 0.16), inset 0 0 10px rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body>
    <main class="about-placeholder">
        <h1>认识君雪</h1>
        <p>这个页面正在重新整理中，请先返回首页。</p>
        <a href="index.html">返回首页</a>
    </main>
</body>
</html>
