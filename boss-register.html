<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老板账号 - 君雪的小小互动星湖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260613-2"></script>
    <style>
        .boss-register-page,
        .boss-register-page * {
            box-sizing: border-box;
        }

        .boss-register-page {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: #4d3f74;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background:
                url("assets/ui/junxue-pearl-star-dust.svg") center/220px 150px repeat,
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.92), transparent 27%),
                radial-gradient(circle at 78% 18%, rgba(214, 190, 255, 0.58), transparent 34%),
                radial-gradient(ellipse at 22% 86%, rgba(165, 226, 255, 0.28), transparent 38%),
                linear-gradient(135deg, #f9f3ff 0%, #eee4ff 32%, #d8c7ff 61%, #bba6ef 100%);
        }

        .boss-register-page::before,
        .boss-register-page::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .boss-register-page::before {
            z-index: -2;
            background:
                linear-gradient(110deg, rgba(255,255,255,.82) 0 16%, rgba(255,255,255,.16) 28%, transparent 43%),
                linear-gradient(74deg, transparent 12%, rgba(186, 154, 255, .2) 36%, rgba(255,255,255,.34) 48%, transparent 68%),
                radial-gradient(circle at 8% 36%, rgba(255, 250, 255, .76), transparent 28%),
                radial-gradient(circle at 92% 76%, rgba(240, 230, 255, .55), transparent 32%);
            opacity: .96;
        }

        .boss-register-page::after {
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(255,255,255,.4), transparent 34%, rgba(145, 119, 216, .2)),
                repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.1) 79px 80px),
                radial-gradient(ellipse at 52% 96%, rgba(255,255,255,.54), transparent 38%);
            opacity: .74;
        }

        .boss-register-layout {
            position: relative;
            width: min(1180px, calc(100vw - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(260px, .86fr) minmax(420px, 1.14fr);
            gap: clamp(22px, 4vw, 54px);
            align-items: center;
            padding: clamp(24px, 5vw, 58px) 0;
        }

        .boss-register-companion {
            position: relative;
            min-height: 620px;
            display: grid;
            align-content: end;
            padding: 28px;
            border-radius: 38px;
            overflow: hidden;
            background:
                radial-gradient(circle at 48% 22%, rgba(255,255,255,.76), transparent 24%),
                radial-gradient(ellipse at 34% 42%, rgba(195, 164, 255, .34), transparent 42%),
                linear-gradient(160deg, rgba(255,255,255,.34), rgba(160, 132, 227, .2));
            border: 1px solid rgba(255,255,255,.42);
            box-shadow: 0 28px 78px rgba(112, 82, 180, .2), inset 0 1px 0 rgba(255,255,255,.72);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            backdrop-filter: blur(18px) saturate(1.2);
        }

        .boss-register-companion::before {
            content: "";
            position: absolute;
            inset: 8% 8% 18% 5%;
            background:
                radial-gradient(ellipse at 48% 30%, rgba(116, 97, 196, .18), transparent 22%),
                radial-gradient(ellipse at 54% 52%, rgba(122, 105, 212, .2), transparent 24%),
                linear-gradient(125deg, transparent 4%, rgba(255,255,255,.52) 18%, rgba(203, 181, 255, .2) 38%, transparent 62%);
            clip-path: polygon(48% 0, 65% 9%, 72% 28%, 84% 42%, 77% 72%, 90% 100%, 20% 100%, 31% 72%, 20% 46%, 31% 24%);
            filter: blur(.2px);
            opacity: .82;
        }

        .boss-register-companion::after {
            content: "";
            position: absolute;
            left: 9%;
            right: 7%;
            bottom: 6%;
            height: 42%;
            background:
                url("assets/ui/junxue-flower-crystal.svg") left bottom/124px 124px no-repeat,
                url("assets/ui/junxue-flower-crystal.svg") right 18%/96px 96px no-repeat,
                linear-gradient(180deg, transparent, rgba(145, 111, 218, .18));
            opacity: .82;
        }

        .boss-register-companion-card {
            position: relative;
            z-index: 1;
            width: min(320px, 100%);
            padding: 18px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.52);
            background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(176, 145, 236, .16));
            color: rgba(255,255,255,.94);
            box-shadow: 0 18px 38px rgba(104, 80, 176, .18), inset 0 1px 0 rgba(255,255,255,.58);
            text-shadow: 0 1px 16px rgba(87, 68, 148, .32);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .boss-register-companion-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .boss-register-companion-card span {
            display: block;
            font-size: 13px;
            line-height: 1.75;
        }

        .boss-register-panel {
            position: relative;
            isolation: isolate;
            padding: clamp(28px, 5vw, 54px);
            border-radius: 44px 34px 44px 34px;
            border: 1px solid rgba(255,255,255,.68);
            background:
                url("assets/ui/junxue-pearl-star-dust.svg") center/220px 150px repeat,
                radial-gradient(circle at 18% 10%, rgba(255,255,255,.92), transparent 30%),
                radial-gradient(circle at 92% 18%, rgba(218, 197, 255, .42), transparent 32%),
                linear-gradient(145deg, rgba(255,255,255,.72), rgba(245, 237, 255, .58) 48%, rgba(226, 212, 255, .54));
            box-shadow:
                0 30px 90px rgba(101, 70, 160, .22),
                0 0 42px rgba(255,255,255,.42),
                inset 0 1px 0 rgba(255,255,255,.86),
                inset 0 -22px 52px rgba(193, 170, 242, .16);
            -webkit-backdrop-filter: blur(22px) saturate(1.18);
            backdrop-filter: blur(22px) saturate(1.18);
        }

        .boss-register-panel::before,
        .boss-register-panel::after {
            content: "";
            position: absolute;
            pointer-events: none;
            z-index: -1;
        }

        .boss-register-panel::before {
            inset: -18px;
            border-radius: inherit;
            background:
                url("assets/ui/junxue-frost-corner-lavender.svg") left top/160px 160px no-repeat,
                url("assets/ui/junxue-frost-corner-lavender.svg") right bottom/160px 160px no-repeat;
            opacity: .72;
        }

        .boss-register-panel::after {
            left: 8%;
            right: 8%;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), rgba(191,163,255,.42), transparent);
            box-shadow: 0 0 28px rgba(255,255,255,.7);
        }

        .boss-register-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: 1px solid rgba(187, 159, 235, .28);
            border-radius: 999px;
            background: rgba(255,255,255,.48);
            color: #8d70bf;
            font-size: 13px;
            font-weight: 800;
        }

        .boss-register-title {
            margin: 18px 0 8px;
            color: #7456a8;
            font-size: clamp(42px, 6vw, 70px);
            line-height: 1;
            letter-spacing: 0;
            text-shadow: 0 8px 26px rgba(129, 91, 184, .18);
        }

        .boss-register-subtitle {
            margin: 0;
            color: #9b7cc6;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 850;
            line-height: 1.45;
        }

        .boss-register-copy {
            margin: 16px 0 0;
            color: rgba(67, 54, 97, .78);
            font-size: 16px;
            line-height: 1.9;
        }

        .boss-register-divider {
            height: 1px;
            margin: 24px 0;
            background: linear-gradient(90deg, transparent, rgba(160, 127, 211, .26), transparent);
        }

        .boss-register-form {
            display: grid;
            gap: 16px;
        }

        .boss-register-field {
            position: relative;
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr);
            align-items: center;
            min-height: 58px;
            padding: 0 18px;
            border: 1px solid rgba(183, 159, 224, .24);
            border-radius: 999px;
            background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(250,246,255,.68));
            box-shadow: 0 12px 24px rgba(104, 77, 160, .12), inset 0 1px 0 rgba(255,255,255,.92);
        }

        .boss-register-label {
            color: #5d516f;
            font-size: 15px;
            font-weight: 850;
            white-space: nowrap;
        }

        .boss-register-input {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            min-width: 0;
            border: 0;
            border-left: 1px solid rgba(151, 128, 190, .18);
            padding: 10px 0 10px 18px;
            background: transparent;
            color: #4d3f68;
            font: inherit;
            font-size: 15px;
            outline: none;
        }

        .boss-register-input::placeholder {
            color: rgba(93, 80, 120, .42);
        }

        .boss-register-field:focus-within {
            border-color: rgba(166, 126, 231, .48);
            box-shadow: 0 0 0 4px rgba(186, 151, 245, .12), 0 14px 26px rgba(104, 77, 160, .14), inset 0 1px 0 rgba(255,255,255,.96);
        }

        .boss-register-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 8px;
        }

        .boss-register-button {
            appearance: none;
            -webkit-appearance: none;
            min-height: 50px;
            border-radius: 999px;
            border: 1px solid rgba(171, 139, 225, .38);
            background: linear-gradient(135deg, rgba(255,255,255,.58), rgba(233, 220, 255, .46));
            color: #775aa9;
            font: inherit;
            font-size: 15px;
            font-weight: 880;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 14px 26px rgba(112, 82, 178, .12);
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
        }

        .boss-register-button:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(150, 112, 215, .58);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 18px 32px rgba(112, 82, 178, .16);
        }

        .boss-register-button:disabled {
            opacity: 1;
            color: rgba(255,255,255,.82);
            cursor: default;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 10px 20px rgba(112, 82, 178, .12);
        }

        .boss-register-button--primary {
            grid-column: 1 / -1;
            min-height: 64px;
            color: #fff;
            font-size: 26px;
            text-shadow: 0 2px 14px rgba(87, 54, 154, .34);
            background:
                url("assets/ui/junxue-pearl-star-dust.svg") center/220px 150px repeat,
                linear-gradient(135deg, #d9a9ff, #b993ef 52%, #d8c7ff);
            border-color: rgba(255,255,255,.62);
            box-shadow: 0 18px 34px rgba(132, 88, 205, .28), inset 0 1px 0 rgba(255,255,255,.58);
        }

        .boss-register-status {
            min-height: 44px;
            margin: 18px 0 0;
            padding: 12px 16px;
            border: 1px solid rgba(172, 143, 220, .2);
            border-radius: 18px;
            background: rgba(255,255,255,.42);
            color: rgba(69, 55, 97, .76);
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .boss-register-status.is-good {
            color: #5d4a96;
            border-color: rgba(152, 216, 200, .48);
            background: rgba(244,255,251,.58);
        }

        .boss-register-status.is-warning {
            color: #9a5070;
            border-color: rgba(222, 138, 176, .38);
            background: rgba(255, 242, 249, .62);
        }

        .boss-register-status.is-neutral {
            color: #7c63ac;
        }

        .boss-register-note {
            margin: 18px 0 0;
            padding: 12px 16px;
            border: 1px solid rgba(184, 154, 227, .2);
            border-radius: 18px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
            color: rgba(99, 78, 137, .72);
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 820px) {
            .boss-register-layout {
                width: min(100%, calc(100vw - 28px));
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 16px 0 24px;
            }

            .boss-register-panel {
                order: 1;
                padding: 24px 16px;
                border-radius: 30px 24px 30px 24px;
            }

            .boss-register-companion {
                order: 2;
                min-height: 170px;
                padding: 16px;
                border-radius: 26px;
            }

            .boss-register-companion::before {
                inset: 4% 8% 8% 45%;
                opacity: .5;
            }

            .boss-register-companion::after {
                left: 4%;
                right: 4%;
                bottom: 0;
                height: 70%;
                background-size: 76px 76px, 64px 64px, auto;
                opacity: .58;
            }

            .boss-register-title {
                font-size: 44px;
            }

            .boss-register-copy {
                font-size: 14px;
            }

            .boss-register-field {
                grid-template-columns: 62px minmax(0, 1fr);
                min-height: 54px;
                padding: 0 12px;
            }

            .boss-register-input {
                padding-left: 12px;
                font-size: 14px;
            }

            .boss-register-actions {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .boss-register-button--primary {
                min-height: 58px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body class="boss-register-page">
    <main class="boss-register-layout" aria-labelledby="boss-register-title">
        <section class="boss-register-companion" aria-label="君雪互动星湖">
            <div class="boss-register-companion-card">
                <strong>感谢你的到来</strong>
                <span>每一次互动，都是记忆里的微光。</span>
            </div>
        </section>

        <section class="boss-register-panel">
            <span class="boss-register-kicker">Junxue Invitation</span>
            <h1 class="boss-register-title" id="boss-register-title">老板账号</h1>
            <p class="boss-register-subtitle">欢迎来到君雪的小小互动星湖</p>
            <p class="boss-register-copy">注册成为老板后，你可以参与互动、发布评价、参与投票，并使用更多专属功能。</p>
            <div class="boss-register-divider" aria-hidden="true"></div>

            <form class="boss-register-form" data-boss-register-form>
                <label class="boss-register-field">
                    <span class="boss-register-label">邮箱</span>
                    <input class="boss-register-input" name="email" type="email" autocomplete="email" placeholder="请输入用于登录的邮箱" required>
                </label>

                <label class="boss-register-field">
                    <span class="boss-register-label">密码</span>
                    <input class="boss-register-input" name="password" type="password" autocomplete="new-password" placeholder="请设置登录密码" required>
                </label>

                <label class="boss-register-field">
                    <span class="boss-register-label">确认密码</span>
                    <input class="boss-register-input" name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" required>
                </label>

                <div class="boss-register-actions">
                    <button class="boss-register-button boss-register-button--primary" type="submit" data-boss-register-submit aria-busy="false">注册老板账号</button>
                    <button class="boss-register-button" type="button" data-boss-register-login>返回登录</button>
                    <button class="boss-register-button" type="button" data-boss-register-menu>返回菜单</button>
                </div>
            </form>

            <div class="boss-register-status is-neutral" data-boss-register-status aria-live="polite">账号仅用于本站互动与评价，不会影响本地记忆中的称呼。</div>
            <p class="boss-register-note">注册后可参与互动、发布评价，并使用更多专属功能。</p>
        </section>
    </main>

    <script src="assets/supabase-config.js?v=20260611-1"></script>
    <script src="assets/price-reviews.js?v=20260623-boss-register-page1"></script>
    <script src="assets/boss-register.js?v=20260623-boss-register-page1"></script>
</body>
</html>
