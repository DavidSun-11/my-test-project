<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老板账号 - 君雪的小小互动星湖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260613-2"></script>
    <style>
        .boss-register-page,
        .boss-register-page * {
            box-sizing: border-box;
        }

        .boss-register-page {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: #4d3f74;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background-image:
                linear-gradient(90deg, rgba(255,255,255,.04), rgba(250,242,255,.1) 42%, rgba(144,111,203,.08)),
                url("assets/images/纯背景框.png"),
                url("assets/ui/junxue-pearl-star-dust.svg"),
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.42), transparent 27%),
                radial-gradient(circle at 78% 18%, rgba(214, 190, 255, 0.22), transparent 34%),
                radial-gradient(ellipse at 22% 86%, rgba(165, 226, 255, 0.14), transparent 38%),
                radial-gradient(ellipse at 50% 112%, rgba(82, 121, 189, .14), transparent 50%),
                linear-gradient(135deg, #fbf6ff 0%, #efe4ff 30%, #d8c7ff 58%, #9f8cdb 100%);
            background-size:
                auto,
                cover,
                220px 150px,
                auto,
                auto,
                auto,
                auto,
                auto;
            background-position:
                center,
                center,
                center,
                center,
                center,
                center,
                center,
                center;
            background-repeat:
                no-repeat,
                no-repeat,
                repeat,
                no-repeat,
                no-repeat,
                no-repeat,
                no-repeat,
                no-repeat;
        }

        .boss-register-page::before,
        .boss-register-page::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .boss-register-page::before {
            z-index: -2;
            background:
                radial-gradient(ellipse at 18% 8%, rgba(255, 255, 255, .45), transparent 28%),
                linear-gradient(112deg, rgba(255,255,255,.22) 0 13%, rgba(255,255,255,.08) 24%, transparent 43%),
                radial-gradient(circle at 92% 76%, rgba(240, 230, 255, .18), transparent 32%);
            opacity: .62;
        }

        .boss-register-page::after {
            z-index: -1;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.24), transparent 36%),
                linear-gradient(180deg, rgba(255,255,255,.08), transparent 34%, rgba(111, 91, 178, .08));
            opacity: .52;
        }

        .boss-register-scene,
        .boss-register-scene::before,
        .boss-register-scene::after {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .boss-register-scene {
            z-index: 0;
            overflow: hidden;
        }

        .boss-register-scene::before {
            content: "";
            background:
                radial-gradient(circle at 17% 11%, rgba(255,255,255,.24), rgba(255,255,255,.12) 15%, transparent 34%),
                radial-gradient(circle at 43% 4%, rgba(241,229,255,.22), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,.08), transparent 42%);
            filter: blur(.2px);
            opacity: .42;
        }

        .boss-register-scene::after {
            content: "";
            background:
                linear-gradient(110deg, rgba(255,255,255,.18) 0 3%, rgba(238,222,255,.1) 9%, transparent 19%),
                radial-gradient(ellipse at 16% 100%, rgba(255,255,255,.18), transparent 34%),
                radial-gradient(ellipse at 92% 100%, rgba(205,188,255,.12), transparent 38%);
            opacity: .38;
        }

        .boss-register-curtain {
            position: fixed;
            inset: -2% -4% auto -4%;
            height: min(46vh, 420px);
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(100deg, rgba(255,255,255,.66) 0 7%, rgba(237,222,255,.35) 14%, transparent 25%),
                linear-gradient(80deg, transparent 20%, rgba(255,255,255,.38) 33%, rgba(226,205,255,.2) 44%, transparent 60%),
                repeating-linear-gradient(92deg, rgba(255,255,255,.18) 0 2px, transparent 2px 34px),
                linear-gradient(180deg, rgba(255,255,255,.68), rgba(235,218,255,.18) 58%, transparent);
            clip-path: polygon(0 0, 100% 0, 100% 62%, 88% 52%, 75% 66%, 62% 50%, 48% 67%, 34% 51%, 20% 64%, 8% 50%, 0 62%);
            filter: blur(.1px);
            opacity: .18;
        }

        .boss-register-hangers {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .boss-register-hanger {
            position: absolute;
            top: 0;
            width: 1px;
            height: var(--hanger-height, 150px);
            left: var(--hanger-left, 12%);
            background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(207,185,255,.35), transparent);
            opacity: calc(var(--hanger-opacity, .7) * .22);
        }

        .boss-register-hanger::before,
        .boss-register-hanger::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            border: 1px solid rgba(255,255,255,.68);
            background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(205,182,255,.32));
            box-shadow: 0 0 18px rgba(255,255,255,.44), 0 0 16px rgba(174,144,235,.22);
        }

        .boss-register-hanger::before {
            bottom: 24px;
            width: 10px;
            height: 10px;
        }

        .boss-register-hanger::after {
            bottom: -4px;
            width: 18px;
            height: 18px;
        }

        .boss-register-layout {
            position: relative;
            z-index: 3;
            width: min(1360px, calc(100vw - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(360px, .92fr) minmax(480px, 1.08fr);
            gap: clamp(16px, 2.4vw, 34px);
            align-items: center;
            padding: clamp(24px, 5vw, 58px) 0;
        }

        .boss-register-companion {
            position: relative;
            min-height: 720px;
            display: grid;
            align-content: end;
            padding: 24px;
            border-radius: 38px;
            overflow: hidden;
            background:
                radial-gradient(circle at 28% 16%, rgba(255,255,255,.18), transparent 24%),
                radial-gradient(ellipse at 35% 58%, rgba(180, 143, 255, .12), transparent 46%),
                radial-gradient(ellipse at 46% 106%, rgba(255,255,255,.22), transparent 44%);
            border: 0;
            box-shadow: none;
        }

        .boss-register-companion::before {
            content: "";
            position: absolute;
            inset: 8% 8% 18% 5%;
            background:
                radial-gradient(ellipse at 48% 30%, rgba(116, 97, 196, .18), transparent 22%),
                radial-gradient(ellipse at 54% 52%, rgba(122, 105, 212, .2), transparent 24%),
                linear-gradient(125deg, transparent 4%, rgba(255,255,255,.52) 18%, rgba(203, 181, 255, .2) 38%, transparent 62%);
            clip-path: polygon(48% 0, 65% 9%, 72% 28%, 84% 42%, 77% 72%, 90% 100%, 20% 100%, 31% 72%, 20% 46%, 31% 24%);
            filter: blur(.2px);
            opacity: .82;
        }

        .boss-register-companion::after {
            content: "";
            position: absolute;
            left: 9%;
            right: 7%;
            bottom: 6%;
            height: 42%;
            background:
                url("assets/ui/junxue-flower-crystal.svg") left bottom/124px 124px no-repeat,
                url("assets/ui/junxue-flower-crystal.svg") right 18%/96px 96px no-repeat,
                linear-gradient(180deg, transparent, rgba(145, 111, 218, .18));
            opacity: .82;
        }

        .boss-register-character {
            position: absolute;
            z-index: 1;
            left: -22%;
            right: -6%;
            bottom: -6%;
            height: min(860px, 108%);
            display: grid;
            place-items: end center;
            pointer-events: none;
        }

        .boss-register-character img {
            display: block;
            width: min(150%, 780px);
            max-width: none;
            height: 100%;
            object-fit: contain;
            object-position: left bottom;
            filter: drop-shadow(0 30px 46px rgba(66, 48, 132, .28)) drop-shadow(0 0 34px rgba(255, 255, 255, .48));
            transform: translateX(-1%);
        }

        .boss-register-companion-card {
            position: relative;
            z-index: 2;
            width: min(320px, 100%);
            padding: 18px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.52);
            background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(176, 145, 236, .16));
            color: rgba(255,255,255,.94);
            box-shadow: 0 18px 38px rgba(104, 80, 176, .18), inset 0 1px 0 rgba(255,255,255,.58);
            text-shadow: 0 1px 16px rgba(87, 68, 148, .32);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .boss-register-companion-card::before {
            content: "";
            position: absolute;
            left: -26px;
            right: -26px;
            bottom: -34px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,.68), rgba(214,194,255,.24) 45%, transparent 72%);
            filter: blur(12px);
            z-index: -1;
        }

        .boss-register-companion-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .boss-register-companion-card span {
            display: block;
            font-size: 13px;
            line-height: 1.75;
        }

        .boss-register-panel-shell {
            position: relative;
            isolation: isolate;
            justify-self: end;
            width: min(670px, 100%);
            min-height: min(860px, calc(100vh - 48px));
            aspect-ratio: 1086 / 1448;
            margin-right: clamp(0px, 2vw, 28px);
            display: grid;
            place-items: center;
            filter: drop-shadow(0 28px 70px rgba(91, 62, 154, .22));
        }

        .boss-register-panel-frame {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: url("assets/images/水晶框.png") center / 100% 100% no-repeat;
        }

        .boss-register-panel-content {
            position: relative;
            z-index: 1;
            width: min(72%, 490px);
            margin: 4% auto 0;
            padding: clamp(28px, 3.6vw, 46px) 0 clamp(24px, 3vw, 38px);
            background:
                radial-gradient(circle at 20% 4%, rgba(255,255,255,.2), transparent 28%),
                linear-gradient(145deg, rgba(255,255,255,.08), rgba(246, 236, 255, .04));
            border-radius: 34px;
        }

        .boss-register-panel-content::before {
            content: "";
            position: absolute;
            inset: 2% -4% auto -4%;
            height: 1px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), rgba(191,163,255,.26), transparent);
            box-shadow: 0 0 22px rgba(255,255,255,.45);
        }

        .boss-register-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: 1px solid rgba(187, 159, 235, .28);
            border-radius: 999px;
            background: rgba(255,255,255,.48);
            color: #8d70bf;
            font-family: "Songti SC", STSong, SimSun, "Noto Serif CJK SC", serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .08em;
        }

        .boss-register-title {
            position: relative;
            width: max-content;
            max-width: 100%;
            margin: 18px auto 10px;
            font-family: "Songti SC", STSong, SimSun, "Noto Serif CJK SC", serif;
            color: #7557aa;
            font-size: clamp(48px, 6.4vw, 78px);
            font-weight: 600;
            line-height: 1.02;
            letter-spacing: .12em;
            text-align: center;
            text-shadow: 0 2px 0 rgba(255,255,255,.72), 0 10px 28px rgba(129, 91, 184, .22), 0 0 24px rgba(255,255,255,.62);
        }

        .boss-register-title::before,
        .boss-register-title::after {
            content: "✦";
            position: absolute;
            top: 52%;
            transform: translateY(-50%);
            color: rgba(154, 114, 210, .68);
            font-family: "Songti SC", STSong, SimSun, serif;
            font-size: .34em;
            letter-spacing: 0;
            text-shadow: 0 0 14px rgba(255,255,255,.86);
        }

        .boss-register-title::before {
            right: calc(100% + 16px);
        }

        .boss-register-title::after {
            left: calc(100% + 16px);
        }

        .boss-register-subtitle {
            margin: 0;
            color: #9a79c4;
            font-family: "Songti SC", STSong, SimSun, "Noto Serif CJK SC", serif;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 600;
            letter-spacing: .08em;
            line-height: 1.45;
            text-align: center;
        }

        .boss-register-copy {
            margin: 18px auto 0;
            max-width: 520px;
            color: rgba(75, 62, 103, .76);
            font-size: 16px;
            line-height: 2;
            text-align: center;
        }

        .boss-register-divider {
            height: 1px;
            margin: 24px 0;
            background: linear-gradient(90deg, transparent, rgba(160, 127, 211, .26), transparent);
        }

        .boss-register-form {
            display: grid;
            gap: 16px;
        }

        .boss-register-field {
            position: relative;
            display: grid;
            grid-template-columns: 34px 74px minmax(0, 1fr);
            align-items: center;
            min-height: 60px;
            padding: 0 18px 0 14px;
            border: 1px solid rgba(183, 159, 224, .24);
            border-radius: 999px;
            background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(250,246,255,.68));
            box-shadow: 0 12px 24px rgba(104, 77, 160, .12), inset 0 1px 0 rgba(255,255,255,.92);
        }

        .boss-register-field::before {
            content: attr(data-icon);
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.9), rgba(225, 207, 255, .42));
            color: rgba(123, 91, 173, .78);
            font-size: 14px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 14px rgba(178, 145, 235, .18);
        }

        .boss-register-label {
            color: #67557d;
            font-size: 15px;
            font-weight: 760;
            white-space: nowrap;
        }

        .boss-register-input {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            min-width: 0;
            border: 0;
            border-left: 1px solid rgba(151, 128, 190, .18);
            padding: 10px 0 10px 18px;
            background: transparent;
            color: #4d3f68;
            font: inherit;
            font-size: 15px;
            outline: none;
        }

        .boss-register-input::placeholder {
            color: rgba(93, 80, 120, .56);
        }

        .boss-register-field:focus-within {
            border-color: rgba(166, 126, 231, .48);
            box-shadow: 0 0 0 4px rgba(186, 151, 245, .12), 0 14px 26px rgba(104, 77, 160, .14), inset 0 1px 0 rgba(255,255,255,.96);
        }

        .boss-register-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 8px;
        }

        .boss-register-button {
            appearance: none;
            -webkit-appearance: none;
            min-height: 50px;
            border-radius: 999px;
            border: 1px solid rgba(171, 139, 225, .38);
            background: linear-gradient(135deg, rgba(255,255,255,.58), rgba(233, 220, 255, .46));
            color: #775aa9;
            font: inherit;
            font-size: 15px;
            font-weight: 760;
            letter-spacing: .04em;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 14px 26px rgba(112, 82, 178, .12);
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
        }

        .boss-register-button:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(150, 112, 215, .58);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 18px 32px rgba(112, 82, 178, .16);
        }

        .boss-register-button:disabled {
            opacity: 1;
            color: rgba(255,255,255,.82);
            cursor: default;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 10px 20px rgba(112, 82, 178, .12);
        }

        .boss-register-button--primary {
            grid-column: 1 / -1;
            min-height: 64px;
            color: #fff;
            font-family: "Songti SC", STSong, SimSun, "Noto Serif CJK SC", serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: .14em;
            text-shadow: 0 2px 14px rgba(87, 54, 154, .34);
            background:
                url("assets/ui/junxue-pearl-star-dust.svg") center/220px 150px repeat,
                linear-gradient(135deg, #d9a9ff, #b993ef 52%, #d8c7ff);
            border-color: rgba(255,255,255,.62);
            box-shadow: 0 18px 34px rgba(132, 88, 205, .28), inset 0 1px 0 rgba(255,255,255,.58);
        }

        .boss-register-status {
            min-height: 44px;
            margin: 18px 0 0;
            padding: 12px 16px;
            border: 1px solid rgba(172, 143, 220, .2);
            border-radius: 18px;
            background: rgba(255,255,255,.42);
            color: rgba(69, 55, 97, .76);
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .boss-register-status.is-good {
            color: #5d4a96;
            border-color: rgba(152, 216, 200, .48);
            background: rgba(244,255,251,.58);
        }

        .boss-register-status.is-warning {
            color: #9a5070;
            border-color: rgba(222, 138, 176, .38);
            background: rgba(255, 242, 249, .62);
        }

        .boss-register-status.is-neutral {
            color: #7c63ac;
        }

        .boss-register-note {
            margin: 18px 0 0;
            padding: 13px 18px;
            border: 1px solid rgba(184, 154, 227, .24);
            border-radius: 999px;
            background:
                url("assets/ui/junxue-pearl-star-dust.svg") center/220px 150px repeat,
                linear-gradient(90deg, transparent, rgba(255,255,255,.52), transparent);
            color: rgba(99, 78, 137, .72);
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 820px) {
            .boss-register-page {
                background-position:
                    54% center,
                    42% center,
                    center,
                    center,
                    center,
                    center,
                    center,
                    center;
            }

            .boss-register-curtain {
                height: 210px;
                opacity: .1;
            }

            .boss-register-hanger {
                height: calc(var(--hanger-height, 150px) * .62);
                opacity: calc(var(--hanger-opacity, .7) * .14);
            }

            .boss-register-layout {
                width: min(100%, calc(100vw - 28px));
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 16px 0 24px;
            }

            .boss-register-panel-shell {
                order: 1;
                justify-self: center;
                width: 100%;
                margin-right: 0;
                min-height: auto;
                aspect-ratio: auto;
                padding: 52px 18px 46px;
                filter: drop-shadow(0 18px 42px rgba(91, 62, 154, .18));
            }

            .boss-register-panel-frame {
                background-size: 100% 100%;
            }

            .boss-register-panel-content {
                width: min(100%, 480px);
                margin: 0 auto;
                padding: 8px 0 4px;
                border-radius: 24px;
                background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(246, 236, 255, .08));
            }

            .boss-register-companion {
                order: 2;
                min-height: 300px;
                padding: 16px;
                border-radius: 26px;
            }

            .boss-register-companion::before {
                inset: 4% 8% 8% 45%;
                opacity: .5;
            }

            .boss-register-companion::after {
                left: 4%;
                right: 4%;
                bottom: 0;
                height: 70%;
                background-size: 76px 76px, 64px 64px, auto;
                opacity: .58;
            }

            .boss-register-character {
                left: -4%;
                right: -4%;
                bottom: -28px;
                height: 310px;
                place-items: end center;
            }

            .boss-register-character img {
                width: min(104vw, 430px);
                height: 100%;
                object-position: center bottom;
                transform: none;
            }

            .boss-register-title {
                font-size: 46px;
                letter-spacing: .08em;
            }

            .boss-register-title::before {
                right: calc(100% + 8px);
            }

            .boss-register-title::after {
                left: calc(100% + 8px);
            }

            .boss-register-copy {
                font-size: 14px;
            }

            .boss-register-field {
                grid-template-columns: 30px 62px minmax(0, 1fr);
                min-height: 54px;
                padding: 0 12px;
            }

            .boss-register-input {
                padding-left: 12px;
                font-size: 14px;
            }

            .boss-register-actions {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .boss-register-button--primary {
                min-height: 58px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body class="boss-register-page">
    <div class="boss-register-scene" aria-hidden="true"></div>
    <div class="boss-register-curtain" aria-hidden="true"></div>
    <div class="boss-register-hangers" aria-hidden="true">
        <span class="boss-register-hanger" style="--hanger-left:10%;--hanger-height:168px;--hanger-opacity:.74"></span>
        <span class="boss-register-hanger" style="--hanger-left:17%;--hanger-height:118px;--hanger-opacity:.58"></span>
        <span class="boss-register-hanger" style="--hanger-left:83%;--hanger-height:138px;--hanger-opacity:.5"></span>
        <span class="boss-register-hanger" style="--hanger-left:91%;--hanger-height:190px;--hanger-opacity:.64"></span>
    </div>
    <main class="boss-register-layout" aria-labelledby="boss-register-title">
        <section class="boss-register-companion" aria-label="君雪互动星湖">
            <figure class="boss-register-character" aria-hidden="true">
                <img src="assets/images/boss-register-ganyu-cutout.png?v=20260624-boss-register-layered-assets1" alt="">
            </figure>
            <div class="boss-register-companion-card">
                <strong>感谢你的到来</strong>
                <span>每一次互动，都是记忆里的微光。</span>
            </div>
        </section>

        <section class="boss-register-panel-shell">
            <div class="boss-register-panel-frame" aria-hidden="true"></div>
            <div class="boss-register-panel-content">
