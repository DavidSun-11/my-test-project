<html lang="zh">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260613-5">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #f7fbff;
            background:
                radial-gradient(circle at 22% 18%, rgba(108, 178, 255, 0.18), transparent 34%),
                radial-gradient(circle at 78% 72%, rgba(108, 229, 255, 0.12), transparent 36%),
                linear-gradient(145deg, #01040b 0%, #04111f 48%, #071b31 100%);
            overflow-x: hidden;
        }

        .contact-bg-overlay,
        .stars,
        .stars2,
        .stars3,
        .meteor-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .contact-bg-overlay {
            z-index: -4;
            background:
                radial-gradient(ellipse at 50% 34%, rgba(19, 65, 116, 0.26), transparent 50%),
                linear-gradient(to bottom, rgba(1, 7, 18, 0.22), rgba(2, 12, 28, 0.46));
        }

        .stars,
        .stars2,
        .stars3 {
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 7px 12px, rgba(255,255,255,0.54) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 76px 132px, rgba(170,212,255,0.36) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 174px 26px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.15px);
            background-size: 310px 210px;
            animation: driftStars 125s linear infinite, starBreath 8s ease-in-out infinite alternate;
            opacity: 0.9;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 18px 28px, rgba(255,255,255,0.78) 0 1px, transparent 1.7px),
                radial-gradient(circle at 162px 144px, rgba(178,218,255,0.54) 0 0.9px, transparent 1.55px);
            background-size: 260px 180px;
            animation: driftStarsReverse 150s linear infinite, starBreath 9s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 36px 54px, rgba(255,255,255,0.34) 0 0.6px, transparent 1px),
                radial-gradient(circle at 210px 118px, rgba(146,198,255,0.28) 0 0.65px, transparent 1px);
            background-size: 360px 240px;
            animation: driftStars 190s linear infinite, starBreath 11s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        .meteor-layer {
            z-index: -2;
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 300px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(199,233,255,0.18), rgba(255,255,255,0.95));
            filter: drop-shadow(0 0 8px rgba(158,220,255,0.9));
            transform: rotate(-28deg);
            animation: meteorFall var(--meteor-duration, 2400ms) cubic-bezier(0.08, 0.7, 0.2, 1) forwards;
        }

        .contact-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 22px 120px;
        }

        .contact-card {
            width: min(560px, calc(100vw - 44px));
            padding: 28px;
            border: 1px solid rgba(108, 229, 255, 0.42);
            border-radius: 18px;
            background:
                radial-gradient(circle at 18% 10%, rgba(108, 229, 255, 0.13), transparent 36%),
                rgba(5, 18, 36, 0.82);
            box-shadow:
                0 0 28px rgba(0, 190, 255, 0.18),
                inset 0 0 22px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .contact-card h1 {
            margin: 0 0 12px;
            color: #eafcff;
            font-size: clamp(24px, 4vw, 32px);
            line-height: 1.35;
            letter-spacing: 0;
            text-shadow: 0 0 16px rgba(108, 229, 255, 0.42);
        }

        .contact-lead {
            margin: 0 auto 20px;
            color: rgba(234, 252, 255, 0.82);
            line-height: 1.7;
        }

        .contact-info {
            display: grid;
            gap: 10px;
            width: min(420px, 100%);
            margin: 0 auto;
            padding: 18px;
            border: 1px solid rgba(255, 232, 163, 0.46);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 232, 163, 0.13), inset 0 0 14px rgba(255, 255, 255, 0.06);
            text-align: left;
        }

        .contact-info p {
            margin: 0;
            color: #f8fdff;
            font-size: 16px;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(108, 229, 255, 0.2);
        }

        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
        }

        .contact-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 16px;
            border: 1px solid rgba(120, 229, 255, 0.52);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(234, 252, 255, 0.86);
            font-size: 13px;
            text-decoration: none;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .cursor-light {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 229, 255, 0.16), transparent 64%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        .ripple {
            position: fixed;
            z-index: 9998;
            width: 14px;
            height: 14px;
            border: 1px solid rgba(120, 229, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rippleOut 0.8s ease-out forwards;
        }

        html.performance-low .cursor-light,
        html.performance-low .ripple,
        html.performance-low .meteor-layer,
        html.performance-low .stars,
        html.performance-low .stars2,
        html.performance-low .stars3 {
            display: none !important;
        }

        html.performance-low .contact-card {
            box-shadow: 0 0 12px rgba(0, 190, 255, 0.12), inset 0 0 10px rgba(255, 255, 255, 0.04);
            backdrop-filter: none;
        }

        @keyframes driftStars {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(-160px, -220px, 0);
            }
        }

        @keyframes driftStarsReverse {
            from {
                transform: translate3d(-100px, -120px, 0);
            }
            to {
                transform: translate3d(80px, 160px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.54;
            }
            to {
                opacity: 0.95;
            }
        }

        @keyframes rippleOut {
            to {
                width: 120px;
                height: 120px;
                opacity: 0;
            }
        }

        @keyframes meteorFall {
            from {
                opacity: 0;
                transform: rotate(-28deg) translate3d(0, 0, 0) scaleX(0.58);
            }
            12%,
            72% {
                opacity: var(--meteor-opacity, 1);
            }
            to {
                opacity: 0;
                transform: rotate(-28deg) translate3d(var(--meteor-travel-x, -920px), var(--meteor-travel-y, 510px), 0) scaleX(1);
            }
        }

        @media (max-width: 720px) {
            .contact-page {
                align-items: flex-start;
                padding-top: 70px;
            }

            .contact-card {
                padding: 22px;
            }
        }

        @media (max-width: 768px) {
            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .cursor-light,
            .ripple,
            .meteor-layer,
            .stars,
            .stars2,
            .stars3 {
                display: none;
            }

            html.performance-high .cursor-light,
            html.performance-high .ripple,
            html.performance-high .meteor-layer,
            html.performance-high .stars,
            html.performance-high .stars2,
            html.performance-high .stars3 {
                display: block;
            }

            .contact-page {
                align-items: flex-start;
                min-height: 100svh;
                padding: 72px 14px 112px;
            }

            .contact-card {
                width: min(100%, 560px);
                padding: 18px;
                border-radius: 16px;
                backdrop-filter: blur(6px);
            }

            .contact-card h1 {
                font-size: clamp(22px, 6vw, 29px);
            }

            .contact-info {
                width: 100%;
                padding: 14px;
            }

            .contact-info p {
                font-size: 15px;
            }

            .contact-actions {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .contact-actions a {
                min-height: 42px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>

</main>

<script>
const pagePerformance = window.JunxuePerformanceMode;
const isLowPerformance = !!(pagePerformance && pagePerformance.isLow && pagePerformance.isLow());
const light = document.querySelector(".cursor-light");

if (!isLowPerformance && light) {
    document.addEventListener("pointermove", function (event) {
        light.style.left = event.clientX + "px";
        light.style.top = event.clientY + "px";
    });
}

document.addEventListener("click", function (event) {
    if (isLowPerformance) {
        return;
    }

    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = event.clientX + "px";
    ripple.style.top = event.clientY + "px";
    document.body.appendChild(ripple);

    window.setTimeout(function () {
        ripple.remove();
    }, 800);
});

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (isLowPerformance || !layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1800, 3200);

        meteor.className = "meteor";
        meteor.style.left = randomBetween(window.innerWidth * 0.56, window.innerWidth + 220) + "px";
        meteor.style.top = randomBetween(-120, window.innerHeight * 0.28) + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(220, 380) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.84, 1));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-760, -1080) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(390, 660) + "px");
        layer.appendChild(meteor);

        window.setTimeout(function () {
            meteor.remove();
        }, duration + 160);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(3000, 8000));
    }

    scheduleNextMeteor();
})();
</script>

</script>
