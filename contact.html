<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#9da8ea">
    <title>联系君雪 - 君雪的小站</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260814-live2d-mobile-menu-loading1"></script>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260613-6">
    <link rel="stylesheet" href="assets/contact-direct.css?v=20260719-responsive-layout-system1">
</head>
<body>
<svg class="contact-symbols" aria-hidden="true">
    <symbol id="contact-icon-flower" viewBox="0 0 24 24">
        <path d="M12 12C7.8 9.6 7.2 5.2 12 2c4.8 3.2 4.2 7.6 0 10Z"/>
        <path d="M12 12c2.4-4.2 6.8-4.8 10 0-3.2 4.8-7.6 4.2-10 0Z"/>
        <path d="M12 12c4.2 2.4 4.8 6.8 0 10-4.8-3.2-4.2-7.6 0-10Z"/>
        <path d="M12 12c-2.4 4.2-6.8 4.8-10 0 3.2-4.8 7.6-4.2 10 0Z"/>
        <circle cx="12" cy="12" r="1.8"/>
    </symbol>
    <symbol id="contact-icon-shield" viewBox="0 0 24 24">
        <path d="M12 3 19 6v5c0 4.5-2.8 8.2-7 10-4.2-1.8-7-5.5-7-10V6l7-3Z"/>
        <path d="m9 12 2 2 4-5"/>
    </symbol>
    <symbol id="contact-icon-wechat" viewBox="0 0 24 24">
        <path d="M10.5 4.5c-4.2 0-7.5 2.7-7.5 6 0 1.8 1 3.4 2.7 4.5l-.7 2.4 2.8-1.2c.9.3 1.8.4 2.7.4 4.2 0 7.5-2.7 7.5-6s-3.3-6.1-7.5-6.1Z"/>
        <path d="M15.5 9c3 0 5.5 2 5.5 4.5 0 1.3-.7 2.5-1.9 3.4l.5 1.8-2-.9c-.7.2-1.4.3-2.1.3-3 0-5.5-2-5.5-4.5S12.5 9 15.5 9Z"/>
        <circle cx="8" cy="9.5" r=".7" class="contact-icon-fill"/>
        <circle cx="13" cy="9.5" r=".7" class="contact-icon-fill"/>
    </symbol>
    <symbol id="contact-icon-qq" viewBox="0 0 24 24">
        <path d="M12 3.2c-3 0-5.2 2.8-5.2 6.4 0 1.2.2 2.4.7 3.3-.9 1.2-1.5 2.7-1.4 4.1.8.3 1.7.1 2.5-.4.9 1.2 2 2 3.4 2s2.5-.8 3.4-2c.8.5 1.7.7 2.5.4.1-1.4-.5-2.9-1.4-4.1.5-.9.7-2.1.7-3.3 0-3.6-2.2-6.4-5.2-6.4Z"/>
        <path d="M8.1 14.1c1.2.9 2.5 1.4 3.9 1.4s2.7-.5 3.9-1.4"/>
    </symbol>
    <symbol id="contact-icon-douyin" viewBox="0 0 24 24">
        <path d="M14 3v11.2a4.5 4.5 0 1 1-3-4.2"/>
        <path d="M14 3c.7 3.1 2.5 4.9 5.5 5.5"/>
    </symbol>
    <symbol id="contact-icon-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="11" height="11" rx="2"/>
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
    </symbol>
    <symbol id="contact-icon-note" viewBox="0 0 24 24">
        <path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
        <path d="M9 8h6M9 12h6M9 16h4"/>
    </symbol>
    <symbol id="contact-icon-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
    </symbol>
    <symbol id="contact-icon-chat" viewBox="0 0 24 24">
        <path d="M4 5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
        <path d="M7 11h.01M12 11h.01M17 11h.01"/>
    </symbol>
    <symbol id="contact-icon-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8"/>
        <path d="M5 10v10h14V10M9 20v-6h6v6"/>
    </symbol>
</svg>

<main class="contact-page">
    <div class="contact-shell">
        <header class="contact-topbar" aria-label="君雪联系服务台">
            <div class="contact-brand">
                <span class="contact-brand__mark" aria-hidden="true">
                    <svg><use href="#contact-icon-flower"></use></svg>
                </span>
                <div>
                    <strong>君雪联系服务台</strong>
                    <span>个人网站 · 温柔沟通</span>
                </div>
            </div>
            <span class="contact-direct-pill">
                <svg aria-hidden="true"><use href="#contact-icon-shield"></use></svg>
                可直接查看联系方式
            </span>
        </header>

        <section class="contact-hero" aria-labelledby="contact-title">
            <div class="contact-hero__ornament" aria-hidden="true">
                <span></span>
                <svg><use href="#contact-icon-flower"></use></svg>
                <span></span>
            </div>
            <h1 id="contact-title">联系君雪</h1>
            <p class="contact-hero__lead">直接添加联系方式，沟通咨询、预约服务与售后安排</p>
            <p class="contact-hero__poem">月华如水，愿与君雪相知相遇，倾心沟通，共赴美好。</p>
        </section>

        <section class="contact-grid" aria-label="君雪的联系方式">
            <button class="contact-card contact-card--wechat" type="button" data-contact-copy data-contact-label="微信号" data-contact-value="b222414901" aria-label="复制微信号 b222414901">
                <span class="contact-card__ribbon">主要联系</span>
                <span class="contact-card__body contact-card__body--wechat">
                    <span class="contact-card__icon contact-card__icon--wechat" aria-hidden="true">
                        <svg><use href="#contact-icon-wechat"></use></svg>
                    </span>
                    <span class="contact-card__content">
                        <span class="contact-card__heading">
                            <strong>微信</strong>
                            <small>推荐首选</small>
                        </span>
                        <span class="contact-card__value">b222414901</span>
                        <span class="contact-card__note">推荐使用微信添加，回复更及时</span>
                    </span>
                    <span class="contact-card__copy" aria-hidden="true">
                        <svg><use href="#contact-icon-copy"></use></svg>
                        一键复制
                    </span>
                </span>
            </button>

            <div class="contact-secondary-list">
                <button class="contact-card contact-card--secondary" type="button" data-contact-copy data-contact-label="QQ号" data-contact-value="1712018019" aria-label="复制 QQ 号 1712018019">
                    <span class="contact-card__icon contact-card__icon--qq" aria-hidden="true">
                        <svg><use href="#contact-icon-qq"></use></svg>
                    </span>
                    <span class="contact-card__content">
                        <strong>QQ</strong>
                        <span class="contact-card__value">1712018019</span>
                    </span>
                    <span class="contact-card__arrow" aria-hidden="true">
                        <svg><use href="#contact-icon-copy"></use></svg>
                    </span>
                </button>

                <button class="contact-card contact-card--secondary" type="button" data-contact-copy data-contact-label="抖音号" data-contact-value="1218997700" aria-label="复制抖音号 1218997700">
                    <span class="contact-card__icon contact-card__icon--douyin" aria-hidden="true">
                        <svg><use href="#contact-icon-douyin"></use></svg>
                    </span>
                    <span class="contact-card__content">
                        <strong>抖音</strong>
                        <span class="contact-card__value">1218997700</span>
                    </span>
                    <span class="contact-card__arrow" aria-hidden="true">
                        <svg><use href="#contact-icon-copy"></use></svg>
                    </span>
                </button>
            </div>

            <aside class="contact-advice" aria-labelledby="contact-advice-title">
                <h2 id="contact-advice-title"><span>◆</span> 联系建议 <span>◆</span></h2>
                <div class="contact-advice__list">
                    <article>
                        <span class="contact-advice__icon" aria-hidden="true"><svg><use href="#contact-icon-note"></use></svg></span>
                        <div><strong>先说明需求</strong><p>简要描述您的需求或问题，有助于更快为您安排。</p></div>
                    </article>
                    <article>
                        <span class="contact-advice__icon" aria-hidden="true"><svg><use href="#contact-icon-calendar"></use></svg></span>
                        <div><strong>备注日期时间</strong><p>如有预约或时间要求，请备注具体日期与时间。</p></div>
                    </article>
                    <article>
                        <span class="contact-advice__icon" aria-hidden="true"><svg><use href="#contact-icon-chat"></use></svg></span>
                        <div><strong>等待君雪回复确认</strong><p>君雪会在看到消息后尽快回复并与您确认细节。</p></div>
                    </article>
                </div>
                <p class="contact-advice__thanks">♥ 感谢您的理解与信任！</p>
            </aside>
        </section>

        <section class="contact-actions" aria-label="联系页面操作">
            <button class="contact-action contact-action--primary" type="button" data-contact-copy data-contact-label="微信号" data-contact-value="b222414901">
                <svg aria-hidden="true"><use href="#contact-icon-wechat"></use></svg>
                复制微信号
            </button>
            <a class="contact-action contact-action--secondary" href="index.html">
                <svg aria-hidden="true"><use href="#contact-icon-home"></use></svg>
                返回首页
            </a>
        </section>

        <footer class="contact-footer"><span>✦</span> 温柔沟通 · 真诚服务 · 用心陪伴 <span>✦</span></footer>
    </div>
</main>

<div class="contact-toast" data-contact-toast role="status" aria-live="polite" aria-atomic="true" hidden></div>

<script src="assets/contact-direct.js?v=20260717-contact-direct-moon-garden1"></script>
<script src="assets/live2d-loader.js?v=20260814-live2d-mobile-menu-loading1" data-live2d-autoload="manual"></script>
</body>
</html>
