<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我的游戏天赋展示</title>
<link rel="stylesheet" href="live2d/live2d-widget.css?v=20260529-4">
<link rel="stylesheet" href="assets/music-player.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #020b1f, #081f3a);
    color: white;
}

header {
    text-align: center;
    padding: 70px 20px;
}

header h1 {
    font-size: 56px;
}

.game-section {
    max-width: 1000px;
    margin: 40px auto;
    padding: 40px;
    border-radius: 24px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

.game-section img {
    width: 100%;
    max-height: 430px;
    object-fit: cover;
    border-radius: 20px;
    margin-bottom: 25px;
}

.honor {
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
}

.naraka {
    box-shadow: 0 0 35px rgba(255, 80, 60, 0.35);
}

.tag {
    display: inline-block;
    margin: 5px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
}

a {
    color: cyan;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>🎮 我的游戏展示</h1>
    <p>王者峡谷与武侠江湖</p>
</header>

<section class="game-section honor">
    <img src="honor.jpg" alt="王者荣耀">

    <h2>王者荣耀 · 高手的记录</h2>
    <p>在你面前的是全能国服选手</p>

    <h3>我的信息</h3>
    <p>常玩位置：全能</p>
    <p>英雄海：深不见底</p>
    <p>最高段位：荣耀黄金</p>

    <h3>关键词</h3>
    <span class="tag">战绩</span>
    <span class="tag">绝活</span>
    <span class="tag">排位</span>
    <span class="tag">高光</span>
</section>

<section class="game-section naraka">
    <img src="naraka.jpg" alt="永劫无间">

    <h2>永劫无间 · 我的武侠高光</h2>
    <p>这里记录我在永劫无间里的武器、角色、连招和精彩瞬间。</p>

    <h3>我的信息</h3>
    <p>常用武器：匕首/长棍/斩马刀</p>
    <p>喜欢角色：季莹莹大王，妖刀姬大王，狐狸大王，冰女大王</p>
    <p>场伤：单排：1.5W+ / 双排：2W+ / 三排：2W+</p>

    <h3>关键词</h3>
    <span class="tag">武侠</span>
    <span class="tag">刀光剑影</span>
    <span class="tag">连招</span>
    <span class="tag">吃鸡</span>
</section>

<div style="text-align:center; padding:40px;">
    <a href="index.html">返回首页</a>
</div>

<!-- 本地音乐播放器：音频文件应位于 assets/audio/music.mp3。 -->
<div class="music-player" aria-label="本地音乐播放器：感谢你曾来过">
    <audio controls loop>
        <source src="assets/audio/music.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- Live2D 看板娘：左下角固定悬浮，不影响游戏展示内容布局。 -->
<div class="live2d-widget" id="live2d-widget" aria-label="Live2D 看板娘">
    <div class="live2d-message">Live2D 加载中...</div>
</div>
<script>
    window.Live2DWidgetConfig = {
        modelName: "ganyu",
        modelPath: "live2d/models/ganyu/Ganyu1024.model3.json",
        dockedPosition: "left",
        scale: 0.18,
        mobileScale: 0.14
    };
</script>
<script src="assets/audio-status.js?v=20260527-3"></script>
<script src="live2d/live2d-widget.js?v=20260529-3"></script>
<script src="assets/live2d-interactions.js?v=20260529-2"></script>
</body>
</html>
