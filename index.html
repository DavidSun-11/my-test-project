<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>君雪的个人网站</title>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260529-2">
    <link rel="stylesheet" href="assets/music-player.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(to bottom, #07111f, #102a43);
            color: #333;
        }

        .stars, .stars2, .stars3  {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 80px 80px;
            animation: moveStars 60s linear infinite;
            z-index: -1;
        }

        .stars2 {
            background-size: 120px 120px;
            opacity: 0.6;
            animation-duration: 90s;
        }

        .stars3 {
            background-size: 160px 160px;
            opacity: 0.4;
            animation-duration: 120s;
        }

        @keyframes moveStars {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-800px);
            }
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        header h1 {
            font-size: 56px;
            margin: 20px 0;
        }

        header p {
            font-size: 22px;
            color: rgba(255,255,255,0.85);
        }

        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 20px;
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #ddd;
            margin-top: 40px;
        }

        .cursor-light {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(
                circle,
                rgba(0, 180, 255, 0.35) 0%,
                rgba(0, 180, 255, 0.12) 40%,
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: left 0.03s linear, top 0.03s linear;
        }

        .ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 180, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 0.8s ease-out forwards;
            z-index: 999;
        }

        @keyframes rippleEffect {
            from {
                width: 20px;
                height: 20px;
                opacity: 1;
            }

            to {
                width: 220px;
                height: 220px;
                opacity: 0;
            }
        }
    </style>
</head>

<body>
<div class="cursor-light"></div>
<div class="stars"></div>
<div class="stars stars2"></div>
<div class="stars stars3"></div>
<header>
    <img src="avatar.png" class="avatar" alt="头像">

    <h1>除却君身三重雪，天下谁人配白衣
        <span style="color: gold;">⭐</span></h1>
    <p>欢迎来到我的个人网站</p>
</header>

<nav>
    <a href="#">首页</a>
    <a href="about.html">关于我</a>
    <a href="#">联系我</a>
    <a href="games.html">游戏展示</a>
</nav>

<section>
    <div class="card">
        <h2>关于我</h2>
        <p>聪明善良勇敢大方完美无瑕</p>
    </div>

    <div class="card">
        <h2>我的技能</h2>
        <ul>
            <li>吃饭</li>
            <li>睡觉</li>
            <li>打游戏</li>
        </ul>
    </div>

    <div class="card">
        <h2>联系方式</h2>
        <p>111111@qq.com</p>
    </div>
</section>

<footer>
    <p>© 2026 我的个人网站</p>
</footer>

<!-- 本地音乐播放器：音频文件应位于 assets/audio/music.mp3。 -->
<div class="music-player" aria-label="本地音乐播放器：感谢你曾来过">
    <audio controls loop>
        <source src="assets/audio/music.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- Live2D 看板娘：左下角固定悬浮，脚本会先检查模型入口和必要贴图文件。 -->
<div class="live2d-widget" id="live2d-widget" aria-label="Live2D 看板娘">
    <div class="live2d-message">Live2D 加载中...</div>
</div>

<script>
const light = document.querySelector(".cursor-light");

document.addEventListener("mousemove", (e) => {
    light.style.left = e.clientX + "px";
    light.style.top = e.clientY + "px";
});

document.addEventListener("click", (e) => {
    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";

    document.body.appendChild(ripple);

    setTimeout(() => {
        ripple.remove();
    }, 800);
});
</script>
<script>
    window.Live2DWidgetConfig = {
        modelName: "ganyu",
        modelPath: "live2d/models/ganyu/Ganyu1024.model3.json",
        dockedPosition: "left",
        scale: 0.216,
        stageStyle: {
            width: 336,
            height: 456
        },
        mobileScale: 0.168,
        mobileStageStyle: {
            width: 228,
            height: 312
        }
    };
</script>
<script src="assets/audio-status.js?v=20260527-3"></script>
<script src="live2d/live2d-widget.js?v=20260529-5"></script>
<script src="assets/live2d-interactions.js?v=20260529-2"></script>
</body>
</html>
