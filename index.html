    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

            height: 100%;

        }

            filter: brightness(1.2);

        }

            border: 1px solid rgba(120, 229, 255, 0.48);
            border-radius: 16px;
            background: rgba(6, 22, 44, 0.78);
            color: rgba(234, 252, 255, 0.94);

            line-height: 1.55;
            text-align: center;
            box-shadow: 0 0 16px rgba(0, 190, 255, 0.18), inset 0 0 10px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .home-boss-status {
            position: fixed;
            top: max(18px, env(safe-area-inset-top));
            left: max(18px, env(safe-area-inset-left));
            z-index: 40;

            gap: 2px;
            max-width: min(250px, calc(100vw - 36px));
            padding: 9px 13px 10px;
            border: 1px solid rgba(159, 232, 255, 0.58);
            border-radius: 999px;
            background:
                radial-gradient(circle at 18% 0%, rgba(136, 222, 255, 0.22), transparent 42%),
                linear-gradient(145deg, rgba(8, 24, 48, 0.78), rgba(28, 47, 82, 0.62));
            box-shadow:
                0 0 18px rgba(93, 204, 255, 0.18),
                0 10px 28px rgba(2, 10, 28, 0.28),
                inset 0 0 12px rgba(255, 255, 255, 0.08);
            color: rgba(236, 251, 255, 0.96);
            font-family: Arial, sans-serif;
            text-align: left;
            cursor: pointer;
            pointer-events: auto;
            -webkit-backdrop-filter: blur(12px) saturate(1.12);
            backdrop-filter: blur(12px) saturate(1.12);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .home-boss-status::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(110deg, rgba(255, 255, 255, 0.14), transparent 52%, rgba(191, 147, 255, 0.12));
            pointer-events: none;
        }

        .home-boss-status:hover {
            transform: translateY(-1px);
            border-color: rgba(199, 243, 255, 0.78);
            box-shadow:
                0 0 22px rgba(105, 216, 255, 0.26),
                0 12px 30px rgba(2, 10, 28, 0.32),
                inset 0 0 14px rgba(255, 255, 255, 0.10);
        }

        .home-boss-status__main,
        .home-boss-status__sub {
            position: relative;
            z-index: 1;
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .home-boss-status__main {
            font-size: 13px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: 0;
        }

        .home-boss-status__sub {
            color: rgba(203, 235, 255, 0.78);
            font-size: 11px;
            line-height: 1.25;
        }

        .home-ganyu-guide[hidden] {
            display: none;
        }

        .home-ganyu-guide {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .home-ganyu-guide::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, rgba(79, 182, 255, 0.18), rgba(2, 8, 22, 0.28) 52%, rgba(2, 8, 22, 0.38));
            pointer-events: none;
        }

        .home-ganyu-guide__panel {
            position: relative;
            z-index: 1;
            width: min(360px, calc(100vw - 32px));
            padding: 20px 18px 18px;
            border: 1px solid rgba(181, 238, 255, 0.68);
            border-radius: 20px;
            background:
                radial-gradient(circle at 16% 0%, rgba(127, 225, 255, 0.24), transparent 38%),
                radial-gradient(circle at 88% 12%, rgba(208, 162, 255, 0.18), transparent 36%),
                linear-gradient(145deg, rgba(12, 30, 58, 0.88), rgba(26, 48, 82, 0.82));

            content: "";

            left: 18px;
            right: 18px;

            background: linear-gradient(90deg, transparent, rgba(215, 247, 255, 0.82), rgba(205, 169, 255, 0.5), transparent);
            pointer-events: none;
        }

        .home-ganyu-guide__close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(199, 239, 255, 0.62);
            border-radius: 999px;
            background: rgba(6, 20, 42, 0.52);
            color: rgba(238, 251, 255, 0.96);
            font-size: 19px;
            line-height: 1;

        }

        .home-ganyu-guide__title {
            margin: 2px 34px 9px 0;
            color: rgba(245, 253, 255, 0.98);
            font-size: 19px;
            line-height: 1.35;
            font-weight: 800;
            letter-spacing: 0;
            text-shadow: 0 0 16px rgba(108, 218, 255, 0.24);
        }

        .home-ganyu-guide__copy {
            margin: 0;
            color: rgba(218, 242, 255, 0.86);
            font-size: 14px;
            line-height: 1.65;
            letter-spacing: 0;
        }

        .home-ganyu-guide__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .home-ganyu-guide__action {
            min-height: 36px;
            padding: 0 14px;
            border: 1px solid rgba(174, 232, 255, 0.62);
            border-radius: 999px;
            background: rgba(10, 29, 55, 0.62);
            color: rgba(233, 250, 255, 0.94);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.08);
        }

        .home-ganyu-guide__action--primary {
            background: linear-gradient(135deg, rgba(72, 184, 236, 0.82), rgba(162, 128, 233, 0.72));
            color: #ffffff;
            box-shadow: 0 0 18px rgba(99, 210, 255, 0.28), inset 0 0 12px rgba(255, 255, 255, 0.12);
        }

        .home-ganyu-guide-highlight {
            animation: homeGanyuGuidePulse 1.6s ease-in-out 1;
        }

        @keyframes homeGanyuGuidePulse {
            0%, 100% {
                filter: none;
                box-shadow: inherit;
            }
            45% {
                filter: drop-shadow(0 0 12px rgba(139, 226, 255, 0.72));
                box-shadow: 0 0 0 3px rgba(185, 239, 255, 0.36), 0 0 24px rgba(108, 218, 255, 0.44);
            }
        }

        .home-bg-overlay {
            z-index: -4;
            background:
                radial-gradient(ellipse at 42% 34%, rgba(19, 65, 116, 0.22), transparent 48%),
                linear-gradient(90deg, rgba(1, 5, 13, 0.54), rgba(2, 13, 28, 0.32) 46%, rgba(1, 5, 13, 0.58)),
                linear-gradient(to bottom, rgba(1, 7, 18, 0.28), rgba(2, 12, 28, 0.46));
        }

        .home-bg-overlay::before,
        .home-bg-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
        }

        .stars, .stars2, .stars3, .meteor-layer {
            display: none;
        }

        .stars, .stars2, .stars3  {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            pointer-events: none;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 7px 12px, rgba(255,255,255,0.54) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 23px 88px, rgba(210,230,255,0.42) 0 0.7px, transparent 1.05px),
                radial-gradient(circle at 48px 34px, rgba(255,255,255,0.34) 0 0.65px, transparent 1px),
                radial-gradient(circle at 76px 132px, rgba(170,212,255,0.36) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 108px 54px, rgba(255,255,255,0.48) 0 0.7px, transparent 1.05px),
                radial-gradient(circle at 142px 156px, rgba(190,222,255,0.30) 0 0.65px, transparent 1px),
                radial-gradient(circle at 174px 26px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.15px),
                radial-gradient(circle at 216px 108px, rgba(146,198,255,0.32) 0 0.7px, transparent 1.1px),
                radial-gradient(circle at 248px 66px, rgba(255,255,255,0.40) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 286px 174px, rgba(255,255,255,0.28) 0 0.65px, transparent 1px);
            background-size: 310px 210px;
            animation: driftStars 125s linear infinite, starBreath 8s ease-in-out infinite alternate;
            opacity: 0.92;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 18px 28px, rgba(255,255,255,0.86) 0 1.1px, transparent 1.75px),
                radial-gradient(circle at 58px 144px, rgba(170,222,255,0.70) 0 1px, transparent 1.65px),
                radial-gradient(circle at 96px 72px, rgba(255,255,255,0.76) 0 1px, transparent 1.7px),
                radial-gradient(circle at 136px 188px, rgba(140,205,255,0.54) 0 0.95px, transparent 1.55px),
                radial-gradient(circle at 182px 38px, rgba(255,255,255,0.78) 0 1.05px, transparent 1.7px),
                radial-gradient(circle at 236px 116px, rgba(194,232,255,0.66) 0 1px, transparent 1.65px),
                radial-gradient(circle at 292px 82px, rgba(255,255,255,0.68) 0 0.95px, transparent 1.6px),
                radial-gradient(circle at 346px 164px, rgba(156,216,255,0.50) 0 1px, transparent 1.7px);
            background-size: 390px 260px;
            animation: driftStars 165s linear infinite, twinkleStars 4.2s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 38px 54px, rgba(255,255,255,0.98) 0 1.7px, rgba(126,210,255,0.34) 2.8px, transparent 6px),
                radial-gradient(circle at 112px 178px, rgba(165,225,255,0.88) 0 1.5px, rgba(96,182,255,0.24) 3.2px, transparent 7px),
                radial-gradient(circle at 204px 36px, rgba(255,255,255,0.84) 0 1.4px, rgba(255,255,255,0.20) 3px, transparent 6px),
                radial-gradient(circle at 318px 132px, rgba(132,210,255,0.80) 0 1.5px, rgba(132,210,255,0.22) 3.4px, transparent 7px),
                radial-gradient(circle at 408px 226px, rgba(255,255,255,0.72) 0 1.3px, rgba(255,255,255,0.16) 3px, transparent 6px);
            background-size: 470px 310px;
            animation: driftStars 210s linear infinite, glowStars 5.8s ease-in-out infinite alternate;
            opacity: 0.56;
        }

        .meteor-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -2;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 300px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent 0%, rgba(90, 190, 255, 0.12) 18%, rgba(156, 226, 255, 0.52) 54%, rgba(245, 252, 255, 1) 100%);
            box-shadow: 0 0 18px rgba(135, 220, 255, 0.95), 0 0 38px rgba(94, 190, 255, 0.52), 0 0 72px rgba(94, 190, 255, 0.22);
            opacity: 0;
            transform: rotate(-28deg) translate3d(0, 0, 0);
            animation: meteorFall var(--meteor-duration, 2400ms) cubic-bezier(0.08, 0.7, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        .meteor::before {
            content: "";
            position: absolute;
            inset: -3px 8px -3px 20%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(170, 232, 255, 0.22), rgba(255,255,255,0.62));
            filter: blur(3px);
        }

        .meteor::after {
            content: "";
            position: absolute;
            right: -3px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 16px rgba(255,255,255,1), 0 0 34px rgba(126,220,255,0.95), 0 0 60px rgba(126,220,255,0.46);
            transform: translateY(-50%);
        }

        @keyframes driftStars {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(-140px, -760px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.66;
            }
            to {
                opacity: 0.96;
            }
        }

        @keyframes twinkleStars {
            0%, 100% {
                opacity: 0.50;
                filter: brightness(0.86);
            }
            48% {
                opacity: 0.82;
                filter: brightness(1.34);
            }
        }

        @keyframes glowStars {
            from {
                opacity: 0.34;
                filter: drop-shadow(0 0 2px rgba(126,210,255,0.42));
            }
            to {
                opacity: 0.64;
                filter: drop-shadow(0 0 9px rgba(126,210,255,0.72));
            }
        }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: rotate(-28deg) translate3d(0, 0, 0) scaleX(0.65);
            }
            10% {
                opacity: var(--meteor-opacity, 1);
            }
            78% {
                opacity: var(--meteor-opacity, 1);
            }
            100% {
                opacity: 0;
                transform: rotate(-28deg) translate3d(var(--meteor-travel-x, -920px), var(--meteor-travel-y, 510px), 0) scaleX(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stars, .stars2, .stars3 {
                animation: none;
            }

            .meteor-layer {
                display: none;
            }
        }

        html.performance-low .home-bg-video,
        html.performance-low .cursor-light,
        html.performance-low .ripple,
        html.performance-low .meteor-layer,
        html.performance-low .stars,
        html.performance-low .stars2,
        html.performance-low .stars3 {
            display: none !important;
        }

        html.performance-low .home-bg-overlay {
            background:
                radial-gradient(ellipse at 50% 18%, rgba(125, 204, 255, 0.16), transparent 38%),
                linear-gradient(90deg, rgba(1, 5, 13, 0.48), rgba(2, 14, 32, 0.24) 48%, rgba(1, 5, 13, 0.48)),
                linear-gradient(to bottom, rgba(2, 8, 22, 0.10), rgba(2, 10, 28, 0.28) 58%, rgba(2, 8, 22, 0.42)),
                var(--home-smooth-bg) center center / cover no-repeat;
        }

        html.performance-low .home-hero::before {
            filter: none;
            opacity: 0.24;
        }

        .home-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 clamp(20px, 5vw, 96px) 0 clamp(380px, 30vw, 560px);
            color: white;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .home-hero::before {
            content: "";
            position: absolute;
            left: clamp(300px, 28vw, 520px);
            top: 22%;
            width: min(38vw, 560px);
            height: min(38vw, 480px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 214, 255, 0.16), rgba(50, 130, 210, 0.07) 42%, transparent 72%);
            filter: blur(8px);
            opacity: 0.72;
            pointer-events: none;
        }

        .home-hero__content {
            position: relative;
            z-index: 1;
            width: min(860px, 58vw);
            max-width: calc(100vw - clamp(400px, 31vw, 580px));
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hero-title-art {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 100%;
            margin-left: 0;
            pointer-events: none;
            opacity: 0.94;
        }

        .hero-title-svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            pointer-events: none;
        }

        .hero-title-svg .hero-title-svg__glow {
            opacity: 0.56;
        }

        .hero-title-svg__shine {
            animation: titleSvgShine 8s ease-in-out infinite;
        }

        .hero-title-svg__spark {
            animation: titleSvgSpark 5.6s ease-in-out infinite;
            transform-origin: center;
        }

        .hero-title-svg__spark:nth-of-type(2n) {
            animation-delay: 1.4s;
        }

        .hero-title-art img {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(140, 218, 255, 0.38));
        }

        .home-title {
            position: relative;
            display: inline-grid;
            gap: 0.02em;
            margin: 0;
            max-width: min(960px, 68vw);
            font-family: STKaiti, KaiTi, "FZKai-Z03", "Songti SC", "Noto Serif SC", serif;
            font-size: clamp(48px, 5.8vw, 98px);
            line-height: 1.04;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: rgba(245, 252, 255, 0.96);
            background: linear-gradient(180deg, #ffffff 0%, #edf9ff 28%, #bfeaff 58%, #f7fcff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.65px rgba(190, 235, 255, 0.48);
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.72),
                1px 0 0 rgba(210, 242, 255, 0.42),
                -1px 0 0 rgba(115, 195, 255, 0.30),
                0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 5px rgba(190, 236, 255, 0.76),

                0 3px 3px rgba(0, 18, 42, 0.56);

            text-rendering: geometricPrecision;

            padding-left: clamp(74px, 8vw, 150px);
        }

        .home-title::before {

            position: absolute;
            left: clamp(-44px, -3vw, -24px);
            top: 52%;
            color: rgba(247, 252, 255, 0.96);

            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.92),

        .home-title::after {

            46% {

                transform: translateX(260px);

            0%, 100% {
                opacity: 0.28;
                transform: scale(0.86);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

<script>
const pagePerformance = window.JunxuePerformanceMode;
const isLowPerformance = !!(pagePerformance && pagePerformance.isLow && pagePerformance.isLow());
const isFullEffectMode = !!(pagePerformance && pagePerformance.requestedMode === "high");
const isMobileViewport = window.matchMedia("(max-width: 768px)").matches ||
    window.matchMedia("(pointer: coarse)").matches ||
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
const manualHighEffectRequestKey = "junxueManualHighEffectRequestedAt";
const manualHighEffectWindowMs = 30000;
const light = document.querySelector(".cursor-light");
const backgroundVideo = document.querySelector(".home-bg-video");

function consumeManualHighEffectRequest() {
    try {
        const value = window.sessionStorage.getItem(manualHighEffectRequestKey);
        const requestedAt = Number(value || 0);
        window.sessionStorage.removeItem(manualHighEffectRequestKey);
        return requestedAt > 0 && Date.now() - requestedAt < manualHighEffectWindowMs;
    } catch (error) {
        return false;
    }
}

function showHomeVideoStatus(message) {
    let status = document.querySelector(".home-video-status");

    if (!status) {
        status = document.createElement("div");
        status.className = "home-video-status";
        status.setAttribute("role", "status");
        status.setAttribute("aria-live", "polite");
        document.body.appendChild(status);
    }

    status.textContent = message;
    window.clearTimeout(showHomeVideoStatus.timer);
    showHomeVideoStatus.timer = window.setTimeout(() => {
        status.remove();
    }, 4200);
}

const manualHighEffectRequested = isFullEffectMode && consumeManualHighEffectRequest();
const shouldLoadBackgroundVideo = isFullEffectMode && (!isMobileViewport || manualHighEffectRequested);
document.documentElement.classList.toggle("mobile-video-unlocked", !!(isMobileViewport && manualHighEffectRequested));

console.info("[JunxuePerformance]", {
    performanceMode: pagePerformance ? pagePerformance.resolvedMode : "unknown",
    isMobile: isMobileViewport,
    shouldLoadVideo: shouldLoadBackgroundVideo,
    live2dAutoload: "home",
    staticGanyuFallback: isMobileViewport,
    dynamicLive2DInitialAttempt: false
});

if (backgroundVideo) {
    const videoSource = backgroundVideo.querySelector("source");

    if (shouldLoadBackgroundVideo) {
        if (isMobileViewport && manualHighEffectRequested) {

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (isLowPerformance || isMobileViewport || !layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1800, 3200);
        const startLeft = randomBetween(window.innerWidth * 0.56, window.innerWidth + 220);
        const startTop = randomBetween(-120, window.innerHeight * 0.28);

        meteor.className = "meteor";
        meteor.style.left = startLeft + "px";
        meteor.style.top = startTop + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(220, 380) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.84, 1));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-760, -1080) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(390, 660) + "px");
        layer.appendChild(meteor);

        window.setTimeout(() => {
            meteor.remove();
        }, duration + 160);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(3000, 8000));
    }

    scheduleNextMeteor();
})();
