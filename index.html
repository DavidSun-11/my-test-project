<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>君雪的个人网站</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260612-5"></script>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260612-2">
    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 44% 30%, rgba(155, 183, 224, 0.30) 0%, rgba(70, 111, 165, 0.14) 18%, transparent 46%),
                radial-gradient(ellipse at 28% 58%, rgba(111, 152, 205, 0.18) 0%, rgba(48, 85, 137, 0.12) 28%, transparent 58%),
                radial-gradient(circle at 80% 12%, rgba(108, 178, 255, 0.14) 0, transparent 34%),
                linear-gradient(to bottom, #01040b 0%, #04111f 42%, #0a2239 100%);
            color: #f7fbff;
            overflow-x: hidden;
        }

        .home-bg-video,
        .home-bg-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .home-bg-video {
            z-index: -5;
            object-fit: cover;
            filter: brightness(1.2);
            display: none;
        }

        html[data-performance-preference="high"] .home-bg-video {
            display: block;
        }

        .home-bg-overlay {
            z-index: -4;
            background:
                radial-gradient(ellipse at 42% 34%, rgba(19, 65, 116, 0.22), transparent 48%),
                linear-gradient(90deg, rgba(1, 5, 13, 0.54), rgba(2, 13, 28, 0.32) 46%, rgba(1, 5, 13, 0.58)),
                linear-gradient(to bottom, rgba(1, 7, 18, 0.28), rgba(2, 12, 28, 0.46));
        }

        .stars, .stars2, .stars3, .meteor-layer {
            display: none;
        }

        .stars, .stars2, .stars3  {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            pointer-events: none;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 7px 12px, rgba(255,255,255,0.54) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 23px 88px, rgba(210,230,255,0.42) 0 0.7px, transparent 1.05px),
                radial-gradient(circle at 48px 34px, rgba(255,255,255,0.34) 0 0.65px, transparent 1px),
                radial-gradient(circle at 76px 132px, rgba(170,212,255,0.36) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 108px 54px, rgba(255,255,255,0.48) 0 0.7px, transparent 1.05px),
                radial-gradient(circle at 142px 156px, rgba(190,222,255,0.30) 0 0.65px, transparent 1px),
                radial-gradient(circle at 174px 26px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.15px),
                radial-gradient(circle at 216px 108px, rgba(146,198,255,0.32) 0 0.7px, transparent 1.1px),
                radial-gradient(circle at 248px 66px, rgba(255,255,255,0.40) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 286px 174px, rgba(255,255,255,0.28) 0 0.65px, transparent 1px);
            background-size: 310px 210px;
            animation: driftStars 125s linear infinite, starBreath 8s ease-in-out infinite alternate;
            opacity: 0.92;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 18px 28px, rgba(255,255,255,0.86) 0 1.1px, transparent 1.75px),
                radial-gradient(circle at 58px 144px, rgba(170,222,255,0.70) 0 1px, transparent 1.65px),
                radial-gradient(circle at 96px 72px, rgba(255,255,255,0.76) 0 1px, transparent 1.7px),
                radial-gradient(circle at 136px 188px, rgba(140,205,255,0.54) 0 0.95px, transparent 1.55px),
                radial-gradient(circle at 182px 38px, rgba(255,255,255,0.78) 0 1.05px, transparent 1.7px),
                radial-gradient(circle at 236px 116px, rgba(194,232,255,0.66) 0 1px, transparent 1.65px),
                radial-gradient(circle at 292px 82px, rgba(255,255,255,0.68) 0 0.95px, transparent 1.6px),
                radial-gradient(circle at 346px 164px, rgba(156,216,255,0.50) 0 1px, transparent 1.7px);
            background-size: 390px 260px;
            animation: driftStars 165s linear infinite, twinkleStars 4.2s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 38px 54px, rgba(255,255,255,0.98) 0 1.7px, rgba(126,210,255,0.34) 2.8px, transparent 6px),
                radial-gradient(circle at 112px 178px, rgba(165,225,255,0.88) 0 1.5px, rgba(96,182,255,0.24) 3.2px, transparent 7px),
                radial-gradient(circle at 204px 36px, rgba(255,255,255,0.84) 0 1.4px, rgba(255,255,255,0.20) 3px, transparent 6px),
                radial-gradient(circle at 318px 132px, rgba(132,210,255,0.80) 0 1.5px, rgba(132,210,255,0.22) 3.4px, transparent 7px),
                radial-gradient(circle at 408px 226px, rgba(255,255,255,0.72) 0 1.3px, rgba(255,255,255,0.16) 3px, transparent 6px);
            background-size: 470px 310px;
            animation: driftStars 210s linear infinite, glowStars 5.8s ease-in-out infinite alternate;
            opacity: 0.56;
        }

        .meteor-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -2;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 300px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent 0%, rgba(90, 190, 255, 0.12) 18%, rgba(156, 226, 255, 0.52) 54%, rgba(245, 252, 255, 1) 100%);
            box-shadow: 0 0 18px rgba(135, 220, 255, 0.95), 0 0 38px rgba(94, 190, 255, 0.52), 0 0 72px rgba(94, 190, 255, 0.22);
            opacity: 0;
            transform: rotate(-28deg) translate3d(0, 0, 0);
            animation: meteorFall var(--meteor-duration, 2400ms) cubic-bezier(0.08, 0.7, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        .meteor::before {
            content: "";
            position: absolute;
            inset: -3px 8px -3px 20%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(170, 232, 255, 0.22), rgba(255,255,255,0.62));
            filter: blur(3px);
        }

        .meteor::after {
            content: "";
            position: absolute;
            right: -3px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 16px rgba(255,255,255,1), 0 0 34px rgba(126,220,255,0.95), 0 0 60px rgba(126,220,255,0.46);
            transform: translateY(-50%);
        }

        @keyframes driftStars {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(-140px, -760px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.66;
            }
            to {
                opacity: 0.96;
            }
        }

        @keyframes twinkleStars {
            0%, 100% {
                opacity: 0.50;
                filter: brightness(0.86);
            }
            48% {
                opacity: 0.82;
                filter: brightness(1.34);
            }
        }

        @keyframes glowStars {
            from {
                opacity: 0.34;
                filter: drop-shadow(0 0 2px rgba(126,210,255,0.42));
            }
            to {
                opacity: 0.64;
                filter: drop-shadow(0 0 9px rgba(126,210,255,0.72));
            }
        }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: rotate(-28deg) translate3d(0, 0, 0) scaleX(0.65);
            }
            10% {
                opacity: var(--meteor-opacity, 1);
            }
            78% {
                opacity: var(--meteor-opacity, 1);
            }
            100% {
                opacity: 0;
                transform: rotate(-28deg) translate3d(var(--meteor-travel-x, -920px), var(--meteor-travel-y, 510px), 0) scaleX(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stars, .stars2, .stars3 {
                animation: none;
            }

            .meteor-layer {
                display: none;
            }
        }

        html.performance-low .home-bg-video,
        html.performance-low .cursor-light,
        html.performance-low .ripple,
        html.performance-low .meteor-layer,
        html.performance-low .stars,
        html.performance-low .stars2,
        html.performance-low .stars3 {
            display: none !important;
        }

        html.performance-low .home-hero::before {
            filter: none;
            opacity: 0.38;
        }

        .home-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 clamp(28px, 8vw, 150px) 0 clamp(240px, 24vw, 410px);
            color: white;
            box-sizing: border-box;
        }

        .home-hero::before {
            content: "";
            position: absolute;
            left: clamp(20px, 7vw, 128px);
            top: 22%;
            width: min(46vw, 640px);
            height: min(46vw, 520px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 214, 255, 0.16), rgba(50, 130, 210, 0.07) 42%, transparent 72%);
            filter: blur(8px);
            opacity: 0.9;
            pointer-events: none;
        }

        .home-hero__content {
            position: relative;
            z-index: 1;
            max-width: 980px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hero-title-art {
            position: relative;
            width: min(1120px, 72vw);
            max-width: 100%;
            margin-left: clamp(-18px, -1.4vw, -8px);
            pointer-events: none;
        }

        .hero-title-svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            pointer-events: none;
        }

        .hero-title-svg__shine {
            animation: titleSvgShine 8s ease-in-out infinite;
        }

        .hero-title-svg__spark {
            animation: titleSvgSpark 5.6s ease-in-out infinite;
            transform-origin: center;
        }

        .hero-title-svg__spark:nth-of-type(2n) {
            animation-delay: 1.4s;
        }

        .hero-title-art img {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(140, 218, 255, 0.38));
        }

        .home-title {
            position: relative;
            display: inline-grid;
            gap: 0.02em;
            margin: 0;
            max-width: min(960px, 68vw);
            font-family: STKaiti, KaiTi, "FZKai-Z03", "Songti SC", "Noto Serif SC", serif;
            font-size: clamp(48px, 5.8vw, 98px);
            line-height: 1.04;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: rgba(245, 252, 255, 0.96);
            background: linear-gradient(180deg, #ffffff 0%, #edf9ff 28%, #bfeaff 58%, #f7fcff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.65px rgba(190, 235, 255, 0.48);
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.72),
                1px 0 0 rgba(210, 242, 255, 0.42),
                -1px 0 0 rgba(115, 195, 255, 0.30),
                0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 5px rgba(190, 236, 255, 0.76),
                0 0 12px rgba(88, 184, 255, 0.38),
                0 3px 3px rgba(0, 18, 42, 0.56);
            filter: drop-shadow(0 0 4px rgba(180, 232, 255, 0.24));
            isolation: isolate;
            text-rendering: geometricPrecision;
        }

        .home-title__line {
            display: block;
            white-space: nowrap;
            filter: contrast(1.08) brightness(1.04);
        }

        .home-title__line:last-child {
            padding-left: clamp(74px, 8vw, 150px);
        }

        .home-title::before {
            content: "✦";
            position: absolute;
            left: clamp(-44px, -3vw, -24px);
            top: 52%;
            color: rgba(247, 252, 255, 0.96);
            font-size: clamp(18px, 1.8vw, 30px);
            -webkit-text-fill-color: currentColor;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.92),
                0 0 10px rgba(116, 218, 255, 0.68);
            animation: titleStarPulse 4.8s ease-in-out infinite;
        }

        .home-title::after {
            content: "";
            display: block;
            width: min(560px, 48vw);
            height: 34px;
            margin-top: -2px;
            margin-left: clamp(-24px, -1.5vw, -10px);
            background:
                radial-gradient(circle at 14% 52%, rgba(255,255,255,0.95) 0 1.4px, rgba(124, 218, 255, 0.34) 2.4px, transparent 6px),
                radial-gradient(circle at 84% 38%, rgba(255,255,255,0.82) 0 1.1px, rgba(124, 218, 255, 0.24) 2.4px, transparent 6px),
                linear-gradient(100deg, transparent 0%, rgba(246, 253, 255, 0.88) 18%, rgba(132, 214, 255, 0.52) 48%, transparent 92%);
            clip-path: polygon(0 48%, 34% 44%, 64% 51%, 100% 45%, 100% 48%, 64% 54%, 34% 47%, 0 51%);
            filter: drop-shadow(0 0 4px rgba(116, 218, 255, 0.52));
            opacity: 0.78;
            -webkit-text-fill-color: initial;
            animation: titleFrostFlow 7s ease-in-out infinite;
        }

        .home-title-fallback[hidden] {
            display: none;
        }

        @keyframes titleStarPulse {
            0%, 100% {
                opacity: 0.62;
                transform: scale(0.92) rotate(0deg);
            }
            48% {
                opacity: 1;
                transform: scale(1.08) rotate(10deg);
            }
        }

        @keyframes titleFrostFlow {
            0%, 100% {
                opacity: 0.66;
                transform: translateX(0);
            }
            50% {
                opacity: 0.96;
                transform: translateX(14px);
            }
        }

        @keyframes titleSvgShine {
            0%, 100% {
                opacity: 0.08;
                transform: translateX(-180px);
            }
            46% {
                opacity: 0.42;
                transform: translateX(210px);
            }
            60% {
                opacity: 0;
                transform: translateX(260px);
            }
        }

        @keyframes titleSvgSpark {
            0%, 100% {
                opacity: 0.28;
                transform: scale(0.86);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        .home-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 28px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(14px, 5vw, 72px);
            align-items: center;
            padding: 0 clamp(28px, 8vw, 150px);
            box-sizing: border-box;
            pointer-events: none;
        }

        .home-nav a {
            position: relative;
            justify-self: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(15px, 1.55vw, 23px);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            text-shadow: 0 0 14px rgba(105, 218, 255, 0.22);
            pointer-events: auto;
            transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
        }

        .home-nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -7px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(82, 204, 255, 0.92));
            box-shadow: 0 0 12px rgba(82, 204, 255, 0.78);
            transform: scaleX(0.72);
            transform-origin: left center;
            opacity: 0.72;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .home-nav a:hover {
            color: white;
            text-shadow: 0 0 18px rgba(116, 225, 255, 0.78), 0 0 34px rgba(76, 156, 255, 0.34);
            transform: translateY(-2px);
        }

        .home-nav a:hover::after {
            opacity: 1;
            transform: scaleX(1);
        }

        .cursor-light {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(
                circle,
                rgba(0, 180, 255, 0.35) 0%,
                rgba(0, 180, 255, 0.12) 40%,
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: left 0.03s linear, top 0.03s linear;
        }

        .ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 180, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 0.8s ease-out forwards;
            z-index: 999;
        }

        @keyframes rippleEffect {
            from {
                width: 20px;
                height: 20px;
                opacity: 1;
            }

            to {
                width: 220px;
                height: 220px;
                opacity: 0;
            }
        }

        @media (max-width: 760px) {
            .home-hero {
                align-items: flex-start;
                min-height: 100vh;
                padding: 18vh 22px 150px;
            }

            .home-title {
                font-size: clamp(34px, 11vw, 54px);
                letter-spacing: 0.08em;
            }

            .home-nav {
                bottom: 18px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                row-gap: 22px;
                padding: 0 22px;
            }

            .home-nav a {
                font-size: 15px;
            }
        }

        @media (max-width: 768px) {
            .home-bg-video {
                display: none;
            }

            html[data-performance-preference="high"] .home-bg-video {
                display: block;
            }

            .cursor-light,
            .ripple,
            .meteor-layer,
            .stars,
            .stars2,
            .stars3 {
                display: none;
            }

            html.performance-high .cursor-light,
            html.performance-high .ripple,
            html.performance-high .meteor-layer,
            html.performance-high .stars,
            html.performance-high .stars2,
            html.performance-high .stars3 {
                display: block;
            }

            .home-hero {
                min-height: 100svh;
                padding: 86px 18px 184px;
                align-items: flex-start;
            }

            .home-hero::before {
                left: 10%;
                top: 16%;
                width: 72vw;
                height: 42vh;
                filter: blur(5px);
                opacity: 0.48;
            }

            .home-hero__content {
                max-width: min(92vw, 560px);
            }

            .hero-title-art {
                width: min(92vw, 560px);
                margin-left: 0;
                margin-top: 4px;
            }

            .hero-title-art img {
                filter: drop-shadow(0 0 5px rgba(140, 218, 255, 0.26));
            }

            .hero-title-svg .hero-title-svg__glow {
                opacity: 0.42;
            }

            .home-title {
                max-width: 100%;
                font-size: clamp(26px, 8.4vw, 40px);
                line-height: 1.18;
                letter-spacing: 0.03em;
                -webkit-text-stroke-width: 0.45px;
                text-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.62),
                    1px 0 0 rgba(210, 242, 255, 0.28),
                    0 0 4px rgba(190, 236, 255, 0.5),
                    0 0 8px rgba(120, 218, 255, 0.28),
                    0 3px 3px rgba(0, 16, 38, 0.52);
            }

            .home-title__line {
                white-space: normal;
            }

            .home-title__line:last-child {
                padding-left: 0;
            }

            .home-title::before {
                left: auto;
                right: 4px;
                top: -18px;
                font-size: 18px;
            }

            .home-title::after {
                width: min(250px, 62vw);
                height: 34px;
                margin-top: 2px;
            }

            .home-nav {
                left: 50%;
                right: auto;
                bottom: max(14px, env(safe-area-inset-bottom));
                width: min(92vw, 420px);
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding: 0;
                transform: translateX(-50%);
            }

            .home-nav a {
                width: 100%;
                min-height: 38px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0 8px;
                border: 1px solid rgba(108, 229, 255, 0.28);
                border-radius: 12px;
                background: rgba(6, 22, 44, 0.5);
                font-size: 13px;
                line-height: 1.25;
                text-align: center;
                box-sizing: border-box;
                backdrop-filter: blur(5px);
            }

            .home-nav a::after {
                display: none;
            }

            html.performance-low .home-nav a {
                backdrop-filter: none;
                box-shadow: none;
            }
        }

        html.performance-low .home-title {
            filter: none;
            -webkit-text-stroke-width: 0.45px;
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.46),
                0 0 4px rgba(120, 218, 255, 0.24);
        }

        html.performance-low .home-title__line {
            filter: none;
        }

        html.performance-low .hero-title-art img {
            filter: none;
        }

        html.performance-low .hero-title-svg__shine,
        html.performance-low .hero-title-svg__spark {
            animation: none;
        }

        html.performance-low .hero-title-svg__shine {
            display: none;
        }

        html.performance-low .hero-title-svg__glow {
            opacity: 0.34;
            filter: none;
        }

        html.performance-low .home-title::before,
        html.performance-low .home-title::after {
            animation: none;
            filter: none;
            opacity: 0.54;
        }

        @media (prefers-reduced-motion: reduce) {
            .home-title::before,
            .home-title::after,
            .hero-title-svg__shine,
            .hero-title-svg__spark {
                animation: none;
            }

            .hero-title-svg__shine {
                display: none;
            }
        }
    </style>
</head>

<body>
<video class="home-bg-video" muted loop playsinline preload="none" aria-hidden="true">
    <source data-src="assets/audio/star.mp4" type="video/mp4">
</video>
<div class="home-bg-overlay" aria-hidden="true"></div>
<div class="cursor-light"></div>
<div class="stars"></div>
<div class="stars stars2"></div>
<div class="stars stars3"></div>
<div class="meteor-layer" aria-hidden="true"></div>
<header class="home-hero">
    <div class="home-hero__content">

<script>
const pagePerformance = window.JunxuePerformanceMode;
const isLowPerformance = !!(pagePerformance && pagePerformance.isLow && pagePerformance.isLow());
const isFullEffectMode = !!(pagePerformance && pagePerformance.requestedMode === "high");
const light = document.querySelector(".cursor-light");
const backgroundVideo = document.querySelector(".home-bg-video");

if (backgroundVideo) {
    const videoSource = backgroundVideo.querySelector("source");

    if (isFullEffectMode) {
        if (videoSource && !videoSource.getAttribute("src")) {
            videoSource.setAttribute("src", videoSource.dataset.src || "");
            backgroundVideo.load();
        }
        backgroundVideo.play().catch(() => {});
    } else {
        backgroundVideo.pause();
        backgroundVideo.removeAttribute("autoplay");
        backgroundVideo.removeAttribute("loop");
        backgroundVideo.removeAttribute("src");
        if (videoSource) {
            videoSource.removeAttribute("src");
        }
        backgroundVideo.load();
    }
}

if (!isLowPerformance && light) {
    document.addEventListener("pointermove", (e) => {
        light.style.left = e.clientX + "px";
        light.style.top = e.clientY + "px";
    });
}

document.addEventListener("click", (e) => {
    if (isLowPerformance) {
        return;
    }

    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";

    document.body.appendChild(ripple);

    setTimeout(() => {
        ripple.remove();
    }, 800);
});

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (isLowPerformance || !layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1800, 3200);
        const startLeft = randomBetween(window.innerWidth * 0.56, window.innerWidth + 220);
        const startTop = randomBetween(-120, window.innerHeight * 0.28);

        meteor.className = "meteor";
        meteor.style.left = startLeft + "px";
        meteor.style.top = startTop + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(220, 380) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.84, 1));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-760, -1080) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(390, 660) + "px");
        layer.appendChild(meteor);

        window.setTimeout(() => {
            meteor.remove();
        }, duration + 160);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(3000, 8000));
    }

    scheduleNextMeteor();
})();
</script>
