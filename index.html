<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>君雪的个人网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #333;
}
.stars, .stars2, .stars3  {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 200%;
    background-repeat: repeat;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 80px 80px;
    animation: moveStars 60s linear infinite;
    z-index: -1;
}
.stars2 {
    background-size: 120px 120px;
    opacity: 0.6;
    animation-duration: 90s;
}

.stars3 {
    background-size: 160px 160px;
    opacity: 0.4;
    animation-duration: 120s;
}

@keyframes moveStars {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-800px);
    }
}

body {
    background: linear-gradient(to bottom, #07111f, #102a43);
}
        
 header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 80px 20px;

    color: white;
}
        header h1 {
     font-size: 56px;
    margin: 20px 0;
}

header p {
      font-size: 22px;
    color: rgba(255,255,255,0.85);
}
        }
        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        section {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 20px;
             display: block;
        }
        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #ddd;
            margin-top: 40px;
        }
    </style>
</head>

<body>
<div class="stars"></div>
<div class="stars stars2"></div>
<div class="stars stars3"></div>
<header>
    <img src="avatar.png" class="avatar">
    <h1>除却君身三重雪，天下谁人配白衣
        <span style="color: gold;">⭐</span></h1>
    <p>欢迎来到我的个人网站</p>
</header>

<nav>
    <a href="#">首页</a>
    <a href="#">关于我</a>
    <a href="#">联系我</a>
</nav>

<section>
    <div class="card">
        <h2>关于我</h2>
        <p>聪明善良勇敢大方完美无瑕</p>
    </div>

    <div class="card">
        <h2>我的技能</h2>
        <ul>
            <li>吃饭</li>
            <li>睡觉</li>
            <li>打游戏</li>
        </ul>
    </div>

    <div class="card">
        <h2>联系方式</h2>
        <p>111111@qq.com</p>
    </div>
</section>

<footer>
    <p>© 2026 我的个人网站</p>
</footer>

</body>
</html>
