<html lang="zh">

    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background:
                radial-gradient(circle at 18% 20%, rgba(78, 162, 210, 0.26) 0, rgba(78, 162, 210, 0.08) 22%, transparent 42%),
                radial-gradient(circle at 78% 8%, rgba(120, 185, 255, 0.18) 0, transparent 34%),
                radial-gradient(circle at 52% 60%, rgba(35, 91, 145, 0.24) 0, transparent 46%),
                linear-gradient(to bottom, #030914 0%, #071a2f 46%, #102a43 100%);
            color: #333;
            overflow-x: hidden;
        }

        .stars, .stars2, .stars3  {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            pointer-events: none;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 11px 18px, rgba(255,255,255,0.52) 0 1px, transparent 1.4px),
                radial-gradient(circle at 68px 92px, rgba(185,224,255,0.34) 0 1px, transparent 1.5px),
                radial-gradient(circle at 142px 44px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.2px),
                radial-gradient(circle at 212px 126px, rgba(152,204,255,0.28) 0 0.9px, transparent 1.3px);
            background-size: 260px 190px;
            animation: driftStars 110s linear infinite, starBreath 7s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 34px 28px, rgba(255,255,255,0.88) 0 1.2px, transparent 1.8px),
                radial-gradient(circle at 118px 86px, rgba(150,218,255,0.72) 0 1px, transparent 1.7px),
                radial-gradient(circle at 198px 48px, rgba(255,255,255,0.66) 0 1.1px, transparent 1.7px),
                radial-gradient(circle at 258px 138px, rgba(188,232,255,0.56) 0 1px, transparent 1.6px);
            background-size: 320px 220px;
            animation: driftStars 150s linear infinite, twinkleStars 4.8s ease-in-out infinite alternate;
            opacity: 0.58;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 52px 54px, rgba(255,255,255,0.95) 0 1.7px, rgba(126,210,255,0.22) 2.6px, transparent 5px),
                radial-gradient(circle at 180px 28px, rgba(164,224,255,0.82) 0 1.5px, rgba(164,224,255,0.18) 3px, transparent 6px),
                radial-gradient(circle at 286px 158px, rgba(255,255,255,0.72) 0 1.4px, rgba(255,255,255,0.14) 3px, transparent 5px);
            background-size: 380px 260px;
            animation: driftStars 190s linear infinite, glowStars 6.4s ease-in-out infinite alternate;
            opacity: 0.42;
        }

        .meteor-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -2;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 160px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent 0%, rgba(130, 216, 255, 0.18) 24%, rgba(224, 248, 255, 0.96) 100%);
            box-shadow: 0 0 14px rgba(116, 212, 255, 0.75), 0 0 28px rgba(116, 212, 255, 0.28);
            opacity: 0;
            transform: rotate(-34deg) translate3d(0, 0, 0);
            animation: meteorFall var(--meteor-duration, 2200ms) ease-out forwards;
            will-change: transform, opacity;
        }

        .meteor::after {
            content: "";
            position: absolute;
            right: -2px;
            top: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 12px rgba(255,255,255,0.95), 0 0 24px rgba(111,210,255,0.75);
            transform: translateY(-50%);
        }

        @keyframes driftStars {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(-120px, -720px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.5;
            }
            to {
                opacity: 0.78;
            }
        }

        @keyframes twinkleStars {
            0%, 100% {
                opacity: 0.42;
                filter: brightness(0.9);
            }
            45% {
                opacity: 0.72;
                filter: brightness(1.28);
            }
        }

        @keyframes glowStars {
            from {
                opacity: 0.28;
                filter: drop-shadow(0 0 2px rgba(126,210,255,0.35));
            }
            to {
                opacity: 0.56;
                filter: drop-shadow(0 0 7px rgba(126,210,255,0.55));
            }
        }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: rotate(-34deg) translate3d(0, 0, 0) scaleX(0.7);
            }
            12% {
                opacity: var(--meteor-opacity, 0.95);
            }
            100% {
                opacity: 0;
                transform: rotate(-34deg) translate3d(var(--meteor-travel-x, -760px), var(--meteor-travel-y, 520px), 0) scaleX(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stars, .stars2, .stars3 {
                animation: none;
            }

            .meteor-layer {
                display: none;
            }
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        header h1 {
            font-size: 56px;
            margin: 20px 0;
        }

        header p {
            font-size: 22px;
            color: rgba(255,255,255,0.85);
        }

        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 20px;
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #ddd;
            margin-top: 40px;
        }

        .cursor-light {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(
                circle,
                rgba(0, 180, 255, 0.35) 0%,
                rgba(0, 180, 255, 0.12) 40%,
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: left 0.03s linear, top 0.03s linear;
        }

        .ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 180, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 0.8s ease-out forwards;
            z-index: 999;
        }

        @keyframes rippleEffect {
            from {
                width: 20px;
                height: 20px;
                opacity: 1;
            }

            to {
                width: 220px;
                height: 220px;
                opacity: 0;
            }
        }
    </style>
</head>

<script>
const light = document.querySelector(".cursor-light");

document.addEventListener("mousemove", (e) => {
    light.style.left = e.clientX + "px";
    light.style.top = e.clientY + "px";
});

document.addEventListener("click", (e) => {
    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";

    document.body.appendChild(ripple);

    setTimeout(() => {
        ripple.remove();
    }, 800);
});

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (!layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1700, 3100);
        const startLeft = randomBetween(window.innerWidth * 0.48, window.innerWidth + 160);
        const startTop = randomBetween(-80, window.innerHeight * 0.34);

        meteor.className = "meteor";
        meteor.style.left = startLeft + "px";
        meteor.style.top = startTop + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(110, 210) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.68, 0.96));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-620, -900) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(360, 620) + "px");
        layer.appendChild(meteor);

        window.setTimeout(() => {
            meteor.remove();
        }, duration + 120);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(2600, 7200));
    }

    scheduleNextMeteor();
})();
</script>
