<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganyu Live2D Host</title>
    <link rel="stylesheet" href="live2d-widget.css?v=20260613-6">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            background: transparent;
        }

        body {
            position: relative;
            touch-action: none;
        }

        #live2d-widget {
            position: fixed !important;
            left: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: visible !important;
            background: transparent !important;
            pointer-events: none;
        }

        #oml2d-main,
        .oml2d-main,
        #oml2d-stage,
        .oml2d-stage {
            position: fixed !important;
            left: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 40px !important;
            min-height: 40px !important;
            max-width: none !important;
            max-height: none !important;
            overflow: visible !important;
            background: transparent !important;
        }

        #oml2d-canvas,
        .oml2d-canvas,
        #live2d-widget canvas,
        canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 40px !important;
            min-height: 40px !important;
            max-width: none !important;
            max-height: none !important;
            background: transparent !important;
        }

        body.is-host-hidden #oml2d-stage,
        body.is-host-hidden .oml2d-stage,
        body.is-host-hidden #oml2d-canvas,
        body.is-host-hidden .oml2d-canvas,
        body.is-host-hidden #oml2d-main,
        body.is-host-hidden .oml2d-main {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="live2d-widget" class="live2d-widget" aria-hidden="true"></div>
    <script>
        window.Live2DWidgetConfig = {
            hostMode: true,
            assetBasePath: ".",
            runtimeBasePath: ".",
            modelName: "ganyu",
            modelPath: "models/ganyu/Ganyu1024.model3.json",
            dockedPosition: "left",
            scale: 0.058,
            mobileScale: 0.058,
            position: [0, 20],
            mobilePosition: [0, 20],
            stageStyle: {
                width: 168,
                height: 340
            },
            mobileStageStyle: {
                width: 168,
                height: 340
            },
            dprCap: 1.5,
            parentOrigin: window.location.origin,
            requestId: new URLSearchParams(window.location.search).get("requestId") || "",
            attemptId: new URLSearchParams(window.location.search).get("attemptId") || "",
            cacheVersion: new URLSearchParams(window.location.search).get("cacheVersion") || "",
            sayHello: false,
            disableStatusBar: true,
            messages: [""]
        };

        var hostConfig = window.Live2DWidgetConfig;

        function postHostMessage(type, detail) {
            if (!window.parent || window.parent === window) {
                return;
            }

            window.parent.postMessage(Object.assign({
                type: type,
                requestId: hostConfig.requestId,
                attemptId: hostConfig.attemptId,
                cacheVersion: hostConfig.cacheVersion
            }, detail || {}), hostConfig.parentOrigin);
        }

        function isCurrentParentMessage(event, data) {
            return !!(
                event &&
                data &&
                event.origin === hostConfig.parentOrigin &&
                event.source === window.parent &&
                String(data.requestId || "") === String(hostConfig.requestId || "") &&
                String(data.attemptId || "") === String(hostConfig.attemptId || "") &&
                String(data.cacheVersion || "") === String(hostConfig.cacheVersion || "")
            );
        }

        function controlRuntime(command) {
            var control = window.JunxueLive2DHostControl;
            if (control && typeof control[command] === "function") {
                control[command]();
            }
        }

        window.addEventListener("message", function (event) {
            var data = event.data || {};

            if (!data || typeof data.type !== "string" || !isCurrentParentMessage(event, data)) {
                return;
            }

            if (data.type === "hide" || data.type === "pause") {
                document.body.classList.add("is-host-hidden");
                controlRuntime("pause");
            }

            if (data.type === "show" || data.type === "resume" || data.type === "resize") {
                document.body.classList.remove("is-host-hidden");
                controlRuntime(data.type === "resize" ? "resize" : "resume");
            }

            if (data.type === "recover") {
                window.location.reload();
            }

            if (data.type === "destroy") {
                controlRuntime("destroy");
            }
        });

        window.addEventListener("error", function (event) {
            postHostMessage("ganyu-host-error", {
                message: event.message || "host-error"
            });
        });

        window.addEventListener("unhandledrejection", function (event) {
            var reason = event.reason || {};

            postHostMessage("ganyu-host-error", {
                message: reason.message || String(reason || "host-promise-error")
            });
        });

        postHostMessage("ganyu-host-script-loaded");
    </script>
    <script src="live2d-widget.js?v=20260730-mobile-live2d-menu-drag1"></script>
</body>
</html>
