<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君雪意见箱</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260608-1"></script>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260608-1">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #f7fbff;
            background:
                radial-gradient(circle at 22% 18%, rgba(108, 178, 255, 0.18), transparent 34%),
                radial-gradient(circle at 78% 72%, rgba(108, 229, 255, 0.12), transparent 36%),
                linear-gradient(145deg, #01040b 0%, #04111f 48%, #071b31 100%);
            overflow-x: hidden;
        }

        .suggest-bg-overlay,
        .stars,
        .stars2,
        .stars3,
        .meteor-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .suggest-bg-overlay {
            z-index: -4;
            background:
                radial-gradient(ellipse at 50% 34%, rgba(19, 65, 116, 0.26), transparent 50%),
                linear-gradient(to bottom, rgba(1, 7, 18, 0.22), rgba(2, 12, 28, 0.46));
        }

        .stars,
        .stars2,
        .stars3 {
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 7px 12px, rgba(255,255,255,0.54) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 76px 132px, rgba(170,212,255,0.36) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 174px 26px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.15px);
            background-size: 310px 210px;
            animation: driftStars 125s linear infinite, starBreath 8s ease-in-out infinite alternate;
            opacity: 0.9;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 18px 28px, rgba(255,255,255,0.78) 0 1px, transparent 1.7px),
                radial-gradient(circle at 162px 144px, rgba(178,218,255,0.54) 0 0.9px, transparent 1.55px);
            background-size: 260px 180px;
            animation: driftStarsReverse 150s linear infinite, starBreath 9s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 36px 54px, rgba(255,255,255,0.34) 0 0.6px, transparent 1px),
                radial-gradient(circle at 210px 118px, rgba(146,198,255,0.28) 0 0.65px, transparent 1px);
            background-size: 360px 240px;
            animation: driftStars 190s linear infinite, starBreath 11s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        .meteor-layer {
            z-index: -2;
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 300px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(199,233,255,0.18), rgba(255,255,255,0.95));
            filter: drop-shadow(0 0 8px rgba(158,220,255,0.9));
            transform: rotate(-28deg);
            animation: meteorFall var(--meteor-duration, 2400ms) cubic-bezier(0.08, 0.7, 0.2, 1) forwards;
        }

        .suggest-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 22px 120px;
        }

        .suggest-card {
            width: min(560px, calc(100vw - 44px));
            padding: 28px;
            border: 1px solid rgba(108, 229, 255, 0.42);
            border-radius: 18px;
            background:
                radial-gradient(circle at 18% 10%, rgba(108, 229, 255, 0.13), transparent 36%),
                rgba(5, 18, 36, 0.82);
            box-shadow:
                0 0 28px rgba(0, 190, 255, 0.18),
                inset 0 0 22px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
        }

        .suggest-card h1 {
            margin: 0 0 18px;
            color: #eafcff;
            font-size: clamp(24px, 4vw, 32px);
            line-height: 1.35;
            letter-spacing: 0;
            text-shadow: 0 0 16px rgba(108, 229, 255, 0.42);
        }

        .suggest-form {
            display: grid;
            gap: 14px;
        }

        .suggest-field {
            display: grid;
            gap: 7px;
            text-align: left;
        }

        .suggest-field label {
            color: rgba(234, 252, 255, 0.88);
            font-size: 14px;
            font-weight: bold;
        }

        .suggest-field input,
        .suggest-field select,
        .suggest-field textarea {
            width: 100%;
            border: 1px solid rgba(108, 229, 255, 0.34);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #f7fbff;
            font: inherit;
            outline: none;
            padding: 11px 12px;
            box-shadow: inset 0 0 12px rgba(108, 229, 255, 0.05);
        }

        .suggest-field textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.55;
        }

        .suggest-field select option {
            background: #ffffff;
            color: #102033;
        }

        .suggest-field input:focus,
        .suggest-field select:focus,
        .suggest-field textarea:focus {
            border-color: rgba(255, 232, 163, 0.72);
            box-shadow: 0 0 16px rgba(255, 232, 163, 0.16), inset 0 0 12px rgba(108, 229, 255, 0.08);
        }

        .suggest-submit {
            min-height: 42px;
            border: 1px solid rgba(120, 229, 255, 0.68);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(73, 214, 255, 0.24), rgba(255, 255, 255, 0.1));
            color: #eafcff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 190, 255, 0.22), inset 0 0 12px rgba(255, 255, 255, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .suggest-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(0, 190, 255, 0.32), 0 0 12px rgba(255, 232, 163, 0.18);
        }

        .suggest-submit:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .suggest-status {
            min-height: 22px;
            color: #9ff5ff;
            font-size: 14px;
            line-height: 1.5;
            text-shadow: 0 0 12px rgba(108, 229, 255, 0.32);
        }

        .suggest-thank-you-bubble {
            position: fixed;
            z-index: 65;
            max-width: min(300px, calc(100vw - 32px));
            padding: 14px 16px;
            border: 1px solid rgba(190, 240, 255, 0.72);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 184, 218, 0.68), rgba(128, 218, 255, 0.42));
            color: #f8fdff;
            font-size: 14px;
            line-height: 1.65;
            text-align: left;
            white-space: pre-line;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.32);
            box-shadow: 0 0 18px rgba(112, 216, 255, 0.32), 0 0 12px rgba(255, 188, 222, 0.28);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.28s ease, transform 0.28s ease;
        }

        .suggest-thank-you-bubble.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        html.performance-low .cursor-light,
        html.performance-low .ripple,
        html.performance-low .meteor-layer,
        html.performance-low .stars,
        html.performance-low .stars2,
        html.performance-low .stars3 {
            display: none !important;
        }

        html.performance-low .suggest-card {
            box-shadow: 0 0 12px rgba(0, 190, 255, 0.12), inset 0 0 10px rgba(255, 255, 255, 0.04);
            backdrop-filter: none;
        }

        html.performance-low .suggest-submit {
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.05);
        }

        html.performance-low .suggest-thank-you-bubble {
            backdrop-filter: none;
            box-shadow: 0 0 10px rgba(112, 216, 255, 0.2);
        }

        .back-home {
            display: inline-block;
            margin-top: 16px;
            color: rgba(214, 246, 255, 0.78);
            font-size: 13px;
            text-decoration: none;
        }

        .cursor-light {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 229, 255, 0.16), transparent 64%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        .ripple {
            position: fixed;
            z-index: 9998;
            width: 14px;
            height: 14px;
            border: 1px solid rgba(159, 245, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rippleEffect 0.8s ease-out forwards;
        }

        @keyframes rippleEffect {
            to {
                width: 92px;
                height: 92px;
                opacity: 0;
            }
        }

        @keyframes driftStars {
            to {
                transform: translate3d(-120px, -240px, 0);
            }
        }

        @keyframes driftStarsReverse {
            to {
                transform: translate3d(120px, -220px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.55;
            }
            to {
                opacity: 0.95;
            }
        }

        @keyframes meteorFall {
            from {
                opacity: 0;
                transform: rotate(-28deg) translate3d(0, 0, 0) scaleX(0.58);
            }
            12%,
            72% {
                opacity: var(--meteor-opacity, 1);
            }
            to {
                opacity: 0;
                transform: rotate(-28deg) translate3d(var(--meteor-travel-x, -920px), var(--meteor-travel-y, 510px), 0) scaleX(1);
            }
        }

        @media (max-width: 720px) {
            .suggest-page {
                align-items: flex-start;
                padding-top: 70px;
            }

            .suggest-card {
                padding: 22px;
            }
        }

        @media (max-width: 768px) {
            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .cursor-light,
            .ripple,
            .meteor-layer,
            .stars,
            .stars2,
            .stars3 {
                display: none;
            }

            html.performance-high .cursor-light,
            html.performance-high .ripple,
            html.performance-high .meteor-layer,
            html.performance-high .stars,
            html.performance-high .stars2,
            html.performance-high .stars3 {
                display: block;
            }

            .suggest-page {
                align-items: flex-start;
                min-height: 100svh;
                padding: 72px 14px 112px;
            }

            .suggest-card {
                width: min(100%, 560px);
                padding: 18px;
                border-radius: 16px;
                backdrop-filter: blur(6px);
            }

            .suggest-card h1 {
                font-size: clamp(21px, 6vw, 28px);
            }

            .suggest-field input,
            .suggest-field select,
            .suggest-field textarea {
                width: 100%;
                min-height: 42px;
                font-size: 15px;
                box-sizing: border-box;
            }

            .suggest-field textarea {
                min-height: 132px;
            }

            .suggest-submit {
                width: 100%;
                min-height: 44px;
                font-size: 15px;
            }

            .suggest-thank-you-bubble {
                max-width: 80vw;
                font-size: 13px;
                backdrop-filter: blur(6px);
            }
        }
    </style>
</head>
<body>
<div class="suggest-bg-overlay" aria-hidden="true"></div>
<div class="cursor-light"></div>
<div class="stars"></div>
<div class="stars stars2"></div>
<div class="stars stars3"></div>
<div class="meteor-layer" aria-hidden="true"></div>

<main class="suggest-page">
    <section class="suggest-card" aria-labelledby="suggest-title">
        <h1 id="suggest-title">请问有什么建议想告诉君雪呢？</h1>
        <form class="suggest-form" id="suggest-form">
            <div class="suggest-field">
                <label for="suggest-name">昵称（可选）</label>
                <input id="suggest-name" name="name" type="text" autocomplete="name">
            </div>
            <div class="suggest-field">
                <label for="suggest-contact">联系方式（可选）</label>
                <input id="suggest-contact" name="contact" type="text" autocomplete="email">
            </div>
            <div class="suggest-field">
                <label for="suggest-type">建议类型</label>
                <select id="suggest-type" name="type">
                    <option value="Bug反馈">Bug反馈</option>
                    <option value="功能建议">功能建议</option>
                    <option value="音乐推荐">音乐推荐</option>
                    <option value="占卜建议">占卜建议</option>
                    <option value="直播建议/反馈">直播建议/反馈</option>
                    <option value="其它">其它</option>
                </select>
            </div>
            <div class="suggest-field">
                <label for="suggest-message">建议内容（必填）</label>
                <textarea id="suggest-message" name="message" required></textarea>
            </div>
            <button class="suggest-submit" type="submit">发送给君雪</button>
            <div class="suggest-status" id="suggest-status" role="status" aria-live="polite"></div>
        </form>
        <a class="back-home" href="index.html">返回首页</a>
    </section>
</main>

<script>
const pagePerformance = window.JunxuePerformanceMode;
const isLowPerformance = !!(pagePerformance && pagePerformance.isLow && pagePerformance.isLow());
const light = document.querySelector(".cursor-light");

if (!isLowPerformance && light) {
    document.addEventListener("pointermove", function (event) {
        light.style.left = event.clientX + "px";
        light.style.top = event.clientY + "px";
    });
}

document.addEventListener("click", function (event) {
    if (isLowPerformance) {
        return;
    }

    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = event.clientX + "px";
    ripple.style.top = event.clientY + "px";
    document.body.appendChild(ripple);

    window.setTimeout(function () {
        ripple.remove();
    }, 800);
});

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (isLowPerformance || !layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1800, 3200);

        meteor.className = "meteor";
        meteor.style.left = randomBetween(window.innerWidth * 0.56, window.innerWidth + 220) + "px";
        meteor.style.top = randomBetween(-120, window.innerHeight * 0.28) + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(220, 380) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.84, 1));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-760, -1080) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(390, 660) + "px");
        layer.appendChild(meteor);

        window.setTimeout(function () {
            meteor.remove();
        }, duration + 160);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(3000, 8000));
    }

    scheduleNextMeteor();
})();
</script>

<script>
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnjyqlyg";
const SUGGESTION_THANK_YOU_VOICE = "assets/audio/ganyu1.mp3";
const SUGGESTION_THANK_YOU_FALLBACK_VOICE = "assets/audio/ganyu_suggest_submit.mp3";
const SUGGESTION_THANK_YOU_TEXT = "谢谢你的建议。\n无论是夸奖还是批评，\n我都会认真看的。";
const form = document.getElementById("suggest-form");
const statusBox = document.getElementById("suggest-status");
const submitButton = form.querySelector(".suggest-submit");
let suggestionThankYouBubble = null;
let suggestionThankYouTimer = null;

function findCoreModelIn(value, depth, seen) {
    if (!value || depth > 5) {
        return null;
    }

    if (seen.has(value)) {
        return null;
    }

    if (typeof value !== "object" && typeof value !== "function") {
        return null;
    }

    seen.add(value);

    try {
        if (value.internalModel &&
            value.internalModel.coreModel &&
            typeof value.internalModel.coreModel.setParameterValueById === "function") {
            return value.internalModel.coreModel;
        }

        if (value.coreModel && typeof value.coreModel.setParameterValueById === "function") {
            return value.coreModel;
        }

        if (typeof value.setParameterValueById === "function") {
            return value;
        }

        const keys = Object.keys(value).slice(0, 80);
        for (let index = 0; index < keys.length; index += 1) {
            const child = findCoreModelIn(value[keys[index]], depth + 1, seen);

            if (child) {
                return child;
            }
        }
    } catch (error) {
        return null;
    }

    return null;
}

function findGanyuCoreModel() {
    const roots = [
        window.OML2D,
        window.oml2d,
        window.Live2DWidget,
        window.PIXI
    ];
    const seen = new WeakSet();

    for (let index = 0; index < roots.length; index += 1) {
        const coreModel = findCoreModelIn(roots[index], 0, seen);

        if (coreModel) {
            return coreModel;
        }
    }

    return null;
}

function setGanyuEyeOpen(coreModel, value) {
    try {
        coreModel.setParameterValueById("ParamEyeLOpen", value);
        coreModel.setParameterValueById("ParamEyeROpen", value);
    } catch (error) {}
}

function triggerGanyuBlink() {
    const coreModel = findGanyuCoreModel();

    if (!coreModel) {
        return;
    }

    setGanyuEyeOpen(coreModel, 0);
    window.setTimeout(function () {
        setGanyuEyeOpen(coreModel, 1);
    }, 120);
}

function getLive2DAnchorRect() {
    const anchor = document.getElementById("oml2d-stage") ||
        document.getElementById("oml2d-canvas") ||
        document.querySelector(".live2d-hit-area");

    if (anchor && typeof anchor.getBoundingClientRect === "function") {
        return anchor.getBoundingClientRect();
    }

    return {
        left: 24,
        right: 264,
        top: window.innerHeight - 440,
        bottom: window.innerHeight - 24,
        width: 240,
        height: 416
    };
}

function positionSuggestionThankYouBubble() {
    if (!suggestionThankYouBubble) {
        return;
    }

    const gap = 14;
    const margin = 16;
    const anchorRect = getLive2DAnchorRect();
    const bubbleRect = suggestionThankYouBubble.getBoundingClientRect();
    const bubbleWidth = Math.min(bubbleRect.width || 300, Math.max(160, window.innerWidth - margin * 2));
    const bubbleHeight = bubbleRect.height || 120;
    const maxLeft = Math.max(margin, window.innerWidth - bubbleWidth - margin);
    const maxTop = Math.max(margin, window.innerHeight - bubbleHeight - margin);
    let left = anchorRect.right + gap;
    let top = anchorRect.top + Math.max(24, anchorRect.height * 0.18);

    suggestionThankYouBubble.style.maxWidth = window.innerWidth <= 768 ? "80vw" : "calc(100vw - " + (margin * 2) + "px)";

    if (left + bubbleWidth + margin > window.innerWidth) {
        left = anchorRect.right - bubbleWidth;
        top = anchorRect.top - bubbleHeight - gap;

        if (top < margin && anchorRect.bottom + gap + bubbleHeight <= window.innerHeight - margin) {
            top = anchorRect.bottom + gap;
        }
    }

    left = Math.max(margin, Math.min(left, maxLeft));
    top = Math.max(margin, Math.min(top, maxTop));

    suggestionThankYouBubble.style.left = left + "px";
    suggestionThankYouBubble.style.top = top + "px";
}

function showSuggestionThankYouBubble() {
    window.clearTimeout(suggestionThankYouTimer);

    if (!suggestionThankYouBubble) {
        suggestionThankYouBubble = document.createElement("div");
        suggestionThankYouBubble.className = "suggest-thank-you-bubble";
        document.body.appendChild(suggestionThankYouBubble);
    }

    suggestionThankYouBubble.textContent = SUGGESTION_THANK_YOU_TEXT;
    positionSuggestionThankYouBubble();
    window.requestAnimationFrame(function () {
        suggestionThankYouBubble.classList.add("is-visible");
    });

    suggestionThankYouTimer = window.setTimeout(function () {
        suggestionThankYouBubble.classList.remove("is-visible");
    }, 6000);
}

function playSuggestionThankYouVoice(file) {
    const audio = new Audio(file || SUGGESTION_THANK_YOU_VOICE);

    audio.volume = 0.8;

    const playRequest = audio.play();
    if (playRequest && typeof playRequest.then === "function") {
        playRequest.catch(function () {
            if (!file && SUGGESTION_THANK_YOU_FALLBACK_VOICE) {
                playSuggestionThankYouVoice(SUGGESTION_THANK_YOU_FALLBACK_VOICE);
            }
        }).catch(function () {});
        return;
    }
}

form.addEventListener("submit", function (event) {
    event.preventDefault();

    submitButton.disabled = true;
    statusBox.textContent = "君雪正在收信...";

    const formData = new FormData(form);
    formData.append("_subject", "君雪网站意见箱");

    fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: {
            Accept: "application/json"
        },
        body: formData
    }).then(function (response) {
        if (!response.ok) {
            throw new Error("form-submit-failed");
        }

        form.reset();
        statusBox.textContent = "君雪收到啦，谢谢你的建议～";
        triggerGanyuBlink();
        showSuggestionThankYouBubble();
        playSuggestionThankYouVoice();
    }).catch(function () {
        statusBox.textContent = "信件好像迷路了，请稍后再试～";
    }).finally(function () {
        submitButton.disabled = false;
    });
});

window.addEventListener("resize", positionSuggestionThankYouBubble);
window.addEventListener("live2d-stage-position-changed", positionSuggestionThankYouBubble);
</script>
<script src="assets/live2d-loader.js?v=20260608-1" data-live2d-autoload="manual"></script>
</body>
