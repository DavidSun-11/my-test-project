<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君雪意见箱</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="assets/performance-mode.js?v=20260613-1"></script>
    <link rel="stylesheet" href="live2d/live2d-widget.css?v=20260613-5">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #f7fbff;
            background:
                radial-gradient(circle at 22% 18%, rgba(108, 178, 255, 0.18), transparent 34%),
                radial-gradient(circle at 78% 72%, rgba(108, 229, 255, 0.12), transparent 36%),
                linear-gradient(145deg, #01040b 0%, #04111f 48%, #071b31 100%);
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: -6;
            background:
                radial-gradient(circle at 14% 28%, rgba(112, 218, 255, 0.18), transparent 26%),
                radial-gradient(circle at 82% 18%, rgba(177, 142, 255, 0.14), transparent 30%),
                radial-gradient(circle at 72% 84%, rgba(84, 205, 255, 0.12), transparent 34%);
        }

        body::after {
            z-index: -5;
            background:
                linear-gradient(115deg, transparent 6%, rgba(116, 210, 255, 0.1) 34%, rgba(175, 143, 255, 0.08) 48%, transparent 68%);
            opacity: 0.78;
            animation: wishLightSweep 18s ease-in-out infinite alternate;
        }

        .suggest-bg-overlay,
        .stars,
        .stars2,
        .stars3,
        .meteor-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .suggest-bg-overlay {
            z-index: -4;
            background:
                radial-gradient(ellipse at 50% 34%, rgba(19, 65, 116, 0.26), transparent 50%),
                radial-gradient(ellipse at 84% 16%, rgba(135, 220, 255, 0.12), transparent 36%),
                radial-gradient(ellipse at 14% 86%, rgba(163, 130, 255, 0.1), transparent 34%),
                linear-gradient(to bottom, rgba(1, 7, 18, 0.22), rgba(2, 12, 28, 0.46));
        }

        .stars,
        .stars2,
        .stars3 {
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            z-index: -3;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(circle at 7px 12px, rgba(255,255,255,0.54) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 76px 132px, rgba(170,212,255,0.36) 0 0.75px, transparent 1.1px),
                radial-gradient(circle at 174px 26px, rgba(255,255,255,0.42) 0 0.8px, transparent 1.15px);
            background-size: 310px 210px;
            animation: driftStars 125s linear infinite, starBreath 8s ease-in-out infinite alternate;
            opacity: 0.9;
        }

        .stars2 {
            background-image:
                radial-gradient(circle at 18px 28px, rgba(255,255,255,0.78) 0 1px, transparent 1.7px),
                radial-gradient(circle at 162px 144px, rgba(178,218,255,0.54) 0 0.9px, transparent 1.55px);
            background-size: 260px 180px;
            animation: driftStarsReverse 150s linear infinite, starBreath 9s ease-in-out infinite alternate;
            opacity: 0.72;
        }

        .stars3 {
            background-image:
                radial-gradient(circle at 36px 54px, rgba(255,255,255,0.34) 0 0.6px, transparent 1px),
                radial-gradient(circle at 210px 118px, rgba(146,198,255,0.28) 0 0.65px, transparent 1px);
            background-size: 360px 240px;
            animation: driftStars 190s linear infinite, starBreath 11s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        .meteor-layer {
            z-index: -2;
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: var(--meteor-length, 300px);
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(199,233,255,0.18), rgba(255,255,255,0.95));
            filter: drop-shadow(0 0 8px rgba(158,220,255,0.9));
            transform: rotate(-28deg);
            animation: meteorFall var(--meteor-duration, 2400ms) cubic-bezier(0.08, 0.7, 0.2, 1) forwards;
        }

        .suggest-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 82px 22px 124px;
        }

        .suggest-card {
            position: relative;
            width: min(820px, calc(100vw - 44px));
            padding: 32px;
            border: 1px solid rgba(142, 229, 255, 0.46);
            border-radius: 28px;
            background:
                radial-gradient(circle at 12% 0%, rgba(116, 229, 255, 0.16), transparent 34%),
                radial-gradient(circle at 92% 12%, rgba(172, 142, 255, 0.14), transparent 32%),
                rgba(5, 18, 36, 0.82);
            box-shadow:
                0 22px 58px rgba(0, 8, 24, 0.44),
                0 0 34px rgba(0, 190, 255, 0.18),
                inset 0 0 26px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            overflow: hidden;
        }

        .suggest-card::before {
            content: "";
            position: absolute;
            left: 28px;
            right: 28px;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(164, 241, 255, 0.88), rgba(197, 166, 255, 0.62), transparent);
            box-shadow: 0 0 18px rgba(122, 222, 255, 0.5);
        }

        .suggest-card::after {
            content: "✦";
            position: absolute;
            right: 32px;
            top: 28px;
            color: rgba(200, 244, 255, 0.76);
            font-size: 22px;
            text-shadow: 0 0 16px rgba(147, 224, 255, 0.8);
            pointer-events: none;
        }

        .suggest-hero {
            position: relative;
            display: grid;
            gap: 10px;
            margin-bottom: 24px;
        }

        .suggest-card h1 {
            margin: 0;
            color: #eafcff;
            font-size: clamp(26px, 4vw, 38px);
            line-height: 1.35;
            letter-spacing: 0;
            text-shadow: 0 0 16px rgba(108, 229, 255, 0.34), 0 2px 10px rgba(0, 8, 24, 0.6);
        }

        .suggest-kicker {
            width: fit-content;
            padding: 6px 12px;
            border: 1px solid rgba(141, 230, 255, 0.68);
            border-radius: 999px;
            background: rgba(83, 196, 255, 0.1);
            color: #bef5ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            box-shadow: inset 0 0 12px rgba(116, 229, 255, 0.08), 0 0 14px rgba(82, 207, 255, 0.14);
        }

        .suggest-lead {
            max-width: 620px;
            margin: 0;
            color: rgba(225, 244, 255, 0.78);
            font-size: 15px;
            line-height: 1.8;
        }

        .suggest-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            position: relative;
            padding: 24px;
            border: 1px solid rgba(153, 230, 255, 0.26);
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(99, 202, 255, 0.06)),
                rgba(9, 28, 52, 0.72);
            box-shadow:
                inset 0 0 28px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .suggest-form::before {
            content: "";
            position: absolute;
            right: 20px;
            bottom: 18px;
            width: 104px;
            height: 66px;
            border: 1px solid rgba(177, 232, 255, 0.12);
            border-top: 0;
            border-radius: 0 0 12px 12px;
            opacity: 0.48;
            pointer-events: none;
        }

        .suggest-form::after {
            content: "";
            position: absolute;
            right: 20px;
            bottom: 50px;
            width: 104px;
            height: 1px;
            background: linear-gradient(90deg, rgba(177, 232, 255, 0.08), rgba(177, 232, 255, 0.22), rgba(177, 232, 255, 0.08));
            transform: rotate(-28deg);
            pointer-events: none;
        }

        .suggest-field {
            display: grid;
            gap: 8px;
            text-align: left;
        }

        .suggest-field--wide,
        .suggest-submit,
        .suggest-status {
            grid-column: 1 / -1;
        }

        .suggest-field label {
            color: rgba(234, 252, 255, 0.88);
            font-size: 14px;
            font-weight: bold;
        }

        .suggest-field input,
        .suggest-field select,
        .suggest-field textarea {
            width: 100%;
            border: 1px solid rgba(108, 229, 255, 0.34);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #f7fbff;
            font: inherit;
            outline: none;
            min-height: 52px;
            padding: 13px 14px;
            box-shadow: inset 0 0 12px rgba(108, 229, 255, 0.05);
        }

        .suggest-field textarea {
            min-height: 198px;
            resize: vertical;
            line-height: 1.55;
        }

        .suggest-field select option {
            background: #ffffff;
            color: #102033;
        }

        .suggest-field input:focus,
        .suggest-field select:focus,
        .suggest-field textarea:focus {
            border-color: rgba(255, 232, 163, 0.72);
            box-shadow: 0 0 16px rgba(255, 232, 163, 0.16), inset 0 0 12px rgba(108, 229, 255, 0.08);
        }

        .suggest-submit {
            min-height: 54px;
            border: 1px solid rgba(120, 229, 255, 0.68);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(85, 210, 255, 0.86), rgba(119, 166, 255, 0.7) 55%, rgba(205, 171, 255, 0.64));
            color: #eafcff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(0, 190, 255, 0.28), inset 0 0 16px rgba(255, 255, 255, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .suggest-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(0, 190, 255, 0.32), 0 0 12px rgba(255, 232, 163, 0.18);
        }

        .suggest-submit:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .suggest-status {
            min-height: 22px;
            color: #9ff5ff;
            font-size: 14px;
            line-height: 1.5;
            text-shadow: 0 0 12px rgba(108, 229, 255, 0.32);
        }

        .suggest-thank-you-bubble {
            position: fixed;
            z-index: 65;
            max-width: min(300px, calc(100vw - 32px));
            padding: 14px 16px;
            border: 1px solid rgba(190, 240, 255, 0.72);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 184, 218, 0.68), rgba(128, 218, 255, 0.42));
            color: #f8fdff;
            font-size: 14px;
            line-height: 1.65;
            text-align: left;
            white-space: pre-line;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.32);
            box-shadow: 0 0 18px rgba(112, 216, 255, 0.32), 0 0 12px rgba(255, 188, 222, 0.28);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.28s ease, transform 0.28s ease;
        }

        .suggest-thank-you-bubble.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        html.performance-low .cursor-light,
        html.performance-low .ripple,
        html.performance-low .meteor-layer,
        html.performance-low .stars,
        html.performance-low .stars2,
        html.performance-low .stars3 {
            display: none !important;
        }

        html.performance-low .suggest-card {
            box-shadow: 0 0 12px rgba(0, 190, 255, 0.12), inset 0 0 10px rgba(255, 255, 255, 0.04);
            backdrop-filter: none;
        }

        html.performance-low .suggest-submit {
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.05);
        }

        html.performance-low .suggest-thank-you-bubble {
            backdrop-filter: none;
            box-shadow: 0 0 10px rgba(112, 216, 255, 0.2);
        }

        .back-home {
            color: rgba(214, 246, 255, 0.82);
        }

        .suggest-footer {
            display: grid;
            gap: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .suggest-footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .suggest-footer-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 7px 13px;
            border: 1px solid rgba(146, 226, 255, 0.26);
            border-radius: 999px;
            background: rgba(8, 28, 52, 0.42);
            color: rgba(214, 246, 255, 0.78);
            font-size: 13px;
            text-decoration: none;
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .suggest-footer-links a:hover {
            color: #f7fdff;
            border-color: rgba(164, 241, 255, 0.52);
            transform: translateY(-1px);
        }

        .suggest-footer-note {
            margin: 0;
            color: rgba(219, 244, 255, 0.62);
            font-size: 13px;
            line-height: 1.6;
        }

        .cursor-light {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 229, 255, 0.16), transparent 64%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        .ripple {
            position: fixed;
            z-index: 9998;
            width: 14px;
            height: 14px;
            border: 1px solid rgba(159, 245, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rippleEffect 0.8s ease-out forwards;
        }

        @keyframes rippleEffect {
            to {
                width: 92px;
                height: 92px;
                opacity: 0;
            }
        }

        @keyframes driftStars {
            to {
                transform: translate3d(-120px, -240px, 0);
            }
        }

        @keyframes driftStarsReverse {
            to {
                transform: translate3d(120px, -220px, 0);
            }
        }

        @keyframes starBreath {
            from {
                opacity: 0.55;
            }
            to {
                opacity: 0.95;
            }
        }

        @keyframes meteorFall {
            from {
                opacity: 0;
                transform: rotate(-28deg) translate3d(0, 0, 0) scaleX(0.58);
            }
            12%,
            72% {
                opacity: var(--meteor-opacity, 1);
            }
            to {
                opacity: 0;
                transform: rotate(-28deg) translate3d(var(--meteor-travel-x, -920px), var(--meteor-travel-y, 510px), 0) scaleX(1);
            }
        }

        @keyframes wishLightSweep {
            from {
                transform: translate3d(-3%, -1%, 0);
                opacity: 0.46;
            }
            to {
                transform: translate3d(3%, 1%, 0);
                opacity: 0.78;
            }
        }

        @media (max-width: 720px) {
            .suggest-page {
                align-items: flex-start;
                padding-top: 70px;
            }

            .suggest-card {
                padding: 22px;
            }
        }

        @media (max-width: 768px) {
            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .cursor-light,
            .ripple,
            .meteor-layer,
            .stars,
            .stars2,
            .stars3 {
                display: none;
            }

            html.performance-high .cursor-light,
            html.performance-high .ripple,
            html.performance-high .meteor-layer,
            html.performance-high .stars,
            html.performance-high .stars2,
            html.performance-high .stars3 {
                display: block;
            }

            .suggest-page {
                align-items: flex-start;
                min-height: 100svh;
                padding: 72px 14px 112px;
            }

            .suggest-card {
                width: min(100%, 560px);
                padding: 18px;
                border-radius: 22px;
                backdrop-filter: blur(6px);
            }

            .suggest-card h1 {
                font-size: clamp(24px, 7vw, 30px);
            }

            .suggest-lead {
                font-size: 14px;
            }

            .suggest-form {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 16px;
                border-radius: 18px;
            }

            .suggest-field input,
            .suggest-field select,
            .suggest-field textarea {
                width: 100%;
                min-height: 48px;
                font-size: 15px;
                box-sizing: border-box;
            }

            .suggest-field textarea {
                min-height: 172px;
            }

            .suggest-submit {
                width: 100%;
                min-height: 52px;
                font-size: 15px;
            }

            .suggest-thank-you-bubble {
                max-width: 80vw;
                font-size: 13px;
                backdrop-filter: blur(6px);
            }
        }

        html.performance-low body::after,
        html.performance-low .suggest-form::after {
            animation: none;
            opacity: 0.3;
        }

        html.performance-low .suggest-card,
        html.performance-low .suggest-form {
            backdrop-filter: none;
        }

        @media (prefers-reduced-motion: reduce) {
            body::after,
            .suggest-submit,
            .suggest-footer-links a {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<script>
const pagePerformance = window.JunxuePerformanceMode;
const isLowPerformance = !!(pagePerformance && pagePerformance.isLow && pagePerformance.isLow());
const light = document.querySelector(".cursor-light");

if (!isLowPerformance && light) {
    document.addEventListener("pointermove", function (event) {
        light.style.left = event.clientX + "px";
        light.style.top = event.clientY + "px";
    });
}

document.addEventListener("click", function (event) {
    if (isLowPerformance) {
        return;
    }

    const ripple = document.createElement("div");

    ripple.className = "ripple";
    ripple.style.left = event.clientX + "px";
    ripple.style.top = event.clientY + "px";
    document.body.appendChild(ripple);

    window.setTimeout(function () {
        ripple.remove();
    }, 800);
});

(function initMeteors() {
    const layer = document.querySelector(".meteor-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxMeteors = 3;
    let timer = null;

    if (isLowPerformance || !layer || reduceMotion.matches) {
        return;
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function spawnMeteor() {
        if (layer.children.length >= maxMeteors) {
            scheduleNextMeteor();
            return;
        }

        const meteor = document.createElement("span");
        const duration = randomBetween(1800, 3200);

        meteor.className = "meteor";
        meteor.style.left = randomBetween(window.innerWidth * 0.56, window.innerWidth + 220) + "px";
        meteor.style.top = randomBetween(-120, window.innerHeight * 0.28) + "px";
        meteor.style.setProperty("--meteor-length", randomBetween(220, 380) + "px");
        meteor.style.setProperty("--meteor-duration", duration + "ms");
        meteor.style.setProperty("--meteor-opacity", randomBetween(0.84, 1));
        meteor.style.setProperty("--meteor-travel-x", randomBetween(-760, -1080) + "px");
        meteor.style.setProperty("--meteor-travel-y", randomBetween(390, 660) + "px");
        layer.appendChild(meteor);

        window.setTimeout(function () {
            meteor.remove();
        }, duration + 160);

        scheduleNextMeteor();
    }

    function scheduleNextMeteor() {
        window.clearTimeout(timer);
        timer = window.setTimeout(spawnMeteor, randomBetween(3000, 8000));
    }

    scheduleNextMeteor();
})();
</script>

<script>
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnjyqlyg";
const SUGGESTION_THANK_YOU_VOICE = "assets/audio/ganyu1.mp3";
const SUGGESTION_THANK_YOU_FALLBACK_VOICE = "assets/audio/ganyu_suggest_submit.mp3";
const SUGGESTION_THANK_YOU_TEXT = "谢谢你的建议。\n无论是夸奖还是批评，\n我都会认真看的。";
const form = document.getElementById("suggest-form");
const statusBox = document.getElementById("suggest-status");
const submitButton = form.querySelector(".suggest-submit");
let suggestionThankYouBubble = null;
let suggestionThankYouTimer = null;

function findCoreModelIn(value, depth, seen) {
    if (!value || depth > 5) {
        return null;
    }

    if (seen.has(value)) {
        return null;
    }

    if (typeof value !== "object" && typeof value !== "function") {
        return null;
    }

    seen.add(value);

    try {
        if (value.internalModel &&
            value.internalModel.coreModel &&
            typeof value.internalModel.coreModel.setParameterValueById === "function") {
            return value.internalModel.coreModel;
        }

        if (value.coreModel && typeof value.coreModel.setParameterValueById === "function") {
            return value.coreModel;
        }

        if (typeof value.setParameterValueById === "function") {
            return value;
        }

        const keys = Object.keys(value).slice(0, 80);
        for (let index = 0; index < keys.length; index += 1) {
            const child = findCoreModelIn(value[keys[index]], depth + 1, seen);

            if (child) {
                return child;
            }
        }
    } catch (error) {
        return null;
    }

    return null;
}

function findGanyuCoreModel() {
    const roots = [
        window.OML2D,
        window.oml2d,
        window.Live2DWidget,
        window.PIXI
    ];
    const seen = new WeakSet();

    for (let index = 0; index < roots.length; index += 1) {
        const coreModel = findCoreModelIn(roots[index], 0, seen);

        if (coreModel) {
            return coreModel;
        }
    }

    return null;
}

function setGanyuEyeOpen(coreModel, value) {
    try {
        coreModel.setParameterValueById("ParamEyeLOpen", value);
        coreModel.setParameterValueById("ParamEyeROpen", value);
    } catch (error) {}
}

function triggerGanyuBlink() {
    const coreModel = findGanyuCoreModel();

    if (!coreModel) {
        return;
    }

    setGanyuEyeOpen(coreModel, 0);
    window.setTimeout(function () {
        setGanyuEyeOpen(coreModel, 1);
    }, 120);
}

function getLive2DAnchorRect() {
    const anchor = document.getElementById("oml2d-stage") ||
        document.getElementById("oml2d-canvas") ||
        document.querySelector(".live2d-hit-area");

    if (anchor && typeof anchor.getBoundingClientRect === "function") {
        return anchor.getBoundingClientRect();
    }

    return {
        left: 24,
        right: 264,
        top: window.innerHeight - 440,
        bottom: window.innerHeight - 24,
        width: 240,
        height: 416
    };
}

function positionSuggestionThankYouBubble() {
    if (!suggestionThankYouBubble) {
        return;
    }

    const gap = 14;
    const margin = 16;
    const anchorRect = getLive2DAnchorRect();
    const bubbleRect = suggestionThankYouBubble.getBoundingClientRect();
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const mobileMaxWidth = Math.max(160, Math.floor(viewportWidth * 0.72));
    const desktopMaxWidth = Math.max(160, viewportWidth - margin * 2);
    const bubbleWidth = Math.min(bubbleRect.width || 300, viewportWidth <= 768 ? mobileMaxWidth : desktopMaxWidth);
    const bubbleHeight = bubbleRect.height || 120;
    const maxLeft = Math.max(margin, viewportWidth - bubbleWidth - margin);
    const maxTop = Math.max(margin, viewportHeight - bubbleHeight - margin);
    const headBottom = anchorRect.top + anchorRect.height * 0.35;
    const preferredTop = Math.min(Math.max(margin, anchorRect.top + Math.max(48, anchorRect.height * 0.38)), maxTop);
    const footTop = Math.min(Math.max(margin, anchorRect.bottom - bubbleHeight - gap), maxTop);
    const candidates = [
        { left: anchorRect.right + gap, top: preferredTop },
        { left: anchorRect.left - gap - bubbleWidth, top: preferredTop },
        { left: Math.min(Math.max(margin, anchorRect.right - bubbleWidth), maxLeft), top: footTop }
    ];
    let left = candidates[2].left;
    let top = candidates[2].top;

    suggestionThankYouBubble.style.maxWidth = viewportWidth <= 768 ? "72vw" : "calc(100vw - " + (margin * 2) + "px)";

    function overlapsHead(nextLeft, nextTop) {
        const right = nextLeft + bubbleWidth;
        const bottom = nextTop + bubbleHeight;
        const overlapsX = right > anchorRect.left && nextLeft < anchorRect.right;
        const overlapsY = bottom > anchorRect.top && nextTop < headBottom;

        return overlapsX && overlapsY;
    }

    for (let index = 0; index < candidates.length; index += 1) {
        const candidate = candidates[index];
        const fitsViewport = candidate.left >= margin &&
            candidate.left + bubbleWidth <= viewportWidth - margin &&
            candidate.top >= margin &&
            candidate.top + bubbleHeight <= viewportHeight - margin;

        if (fitsViewport && !overlapsHead(candidate.left, candidate.top)) {
            left = candidate.left;
            top = candidate.top;
            break;
        }
    }

    left = Math.max(margin, Math.min(left, maxLeft));
    top = Math.max(margin, Math.min(top, maxTop));

    suggestionThankYouBubble.style.left = left + "px";
    suggestionThankYouBubble.style.top = top + "px";
}

function showSuggestionThankYouBubble() {
    window.clearTimeout(suggestionThankYouTimer);

    if (!suggestionThankYouBubble) {
        suggestionThankYouBubble = document.createElement("div");
        suggestionThankYouBubble.className = "suggest-thank-you-bubble";
        document.body.appendChild(suggestionThankYouBubble);
    }

    suggestionThankYouBubble.textContent = SUGGESTION_THANK_YOU_TEXT;
    positionSuggestionThankYouBubble();
    window.requestAnimationFrame(function () {
        suggestionThankYouBubble.classList.add("is-visible");
    });

    suggestionThankYouTimer = window.setTimeout(function () {
        suggestionThankYouBubble.classList.remove("is-visible");
    }, 6000);
}

function playSuggestionThankYouVoice(file) {
    const audio = new Audio(file || SUGGESTION_THANK_YOU_VOICE);

    audio.volume = 0.8;

    const playRequest = audio.play();
    if (playRequest && typeof playRequest.then === "function") {
        playRequest.catch(function () {
            if (!file && SUGGESTION_THANK_YOU_FALLBACK_VOICE) {
                playSuggestionThankYouVoice(SUGGESTION_THANK_YOU_FALLBACK_VOICE);
            }
        }).catch(function () {});
        return;
    }
}

form.addEventListener("submit", function (event) {
    event.preventDefault();

    submitButton.disabled = true;
    statusBox.textContent = "君雪正在收信...";

    const formData = new FormData(form);
    formData.append("_subject", "君雪网站意见箱");

    fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: {
            Accept: "application/json"
        },
        body: formData
    }).then(function (response) {
        if (!response.ok) {
            throw new Error("form-submit-failed");
        }

        form.reset();
        statusBox.textContent = "君雪收到啦，谢谢你的建议～";
        triggerGanyuBlink();
        showSuggestionThankYouBubble();
        playSuggestionThankYouVoice();
    }).catch(function () {
        statusBox.textContent = "信件好像迷路了，请稍后再试～";
    }).finally(function () {
        submitButton.disabled = false;
    });
});

window.addEventListener("resize", positionSuggestionThankYouBubble);
window.addEventListener("live2d-stage-position-changed", positionSuggestionThankYouBubble);
</script>
<script src="assets/live2d-loader.js?v=20260613-4" data-live2d-autoload="manual"></script>
</body>
</html>
